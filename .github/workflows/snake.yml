name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # This step was missing before, so `git add`/`git commit`/`git push` below ran
      # in a directory that was not a git repository and the job always failed.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake game SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake-violet.svg?palette=violet
            output/github-contribution-grid-snake-yellow.svg?palette=yellow
            output/github-contribution-grid-snake-dark.svg?palette=github-dark
            output/github-contribution-grid-snake.svg

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: regenerate contribution snake"
          git push
