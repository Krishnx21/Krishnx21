<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" role="img" aria-label="Terminal running whoami for Krishna Kumar Sharma">
  <title>krishna@github:~$ whoami --verbose</title>

  <defs>
    <!-- NOTE: no @import here on purpose. When an SVG is loaded via <img> (which is
         how GitHub renders README images) external font fetches are blocked, so we
         rely on a robust local monospace stack instead. -->
    <linearGradient id="wa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#05060B"/>
    </linearGradient>

    <linearGradient id="wa-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="wa-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="wa-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- typing masks: a rect whose width animates, revealing text left-to-right -->
    <clipPath id="wa-type1"><rect x="196" y="50" height="24" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
               values="0;0;272;272;0;0" keyTimes="0;0.012;0.085;0.930;0.965;1" calcMode="linear"/>
    </rect></clipPath>

    <clipPath id="wa-type2"><rect x="196" y="238" height="24" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
               values="0;0;300;300;0;0" keyTimes="0;0.205;0.280;0.930;0.965;1" calcMode="linear"/>
    </rect></clipPath>

    <style>
      .m  { font-family: "JetBrains Mono","Cascadia Code","SF Mono","DejaVu Sans Mono",
             "Liberation Mono",Consolas,Menlo,monospace; }
      .lbl{ fill:#64748B; font-size:12.5px; }
      .val{ fill:#E6EDF3; font-size:13.5px; }
      .cy { fill:#00D4FF; }
      .gn { fill:#22C55E; }
    </style>
  </defs>

  <!-- ============ window shell ============ -->
  <rect x="0.5" y="0.5" width="879" height="391" rx="12" fill="url(#wa-bg)" stroke="#1E293B"/>

  <!-- title bar (rounded top corners only) -->
  <path d="M0.5 12.5 A12 12 0 0 1 12.5 0.5 H867.5 A12 12 0 0 1 879.5 12.5 V36.5 H0.5 Z"
        fill="#05060B" stroke="#1E293B"/>
  <circle cx="22" cy="18.5" r="5.5" fill="#FF5F57"/>
  <circle cx="42" cy="18.5" r="5.5" fill="#FEBC2E"/>
  <circle cx="62" cy="18.5" r="5.5" fill="#28C840"/>
  <text class="m" x="440" y="23" text-anchor="middle" font-size="12" fill="#475569">
    krishna@github — ~/profile — zsh
  </text>

  <!-- travelling scanline for that CRT feel -->
  <rect x="1" y="37" width="878" height="70" fill="url(#wa-scan)" opacity="0.05">
    <animate attributeName="y" dur="7s" repeatCount="indefinite"
             values="37;321;37" keyTimes="0;0.5;1" calcMode="linear"/>
  </rect>

  <!-- ============ command 1 ============ -->
  <g class="m">
    <text x="30" y="68" font-size="13.5" class="cy" font-weight="700">krishna@github</text>
    <text x="150" y="68" font-size="13.5" fill="#64748B">:~$</text>
    <g clip-path="url(#wa-type1)">
      <text x="200" y="68" class="val" font-weight="700">whoami --verbose</text>
    </g>
  </g>

  <!-- ============ identity card ============ -->
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
             values="0;0;1;1;0;0" keyTimes="0;0.093;0.110;0.930;0.960;1"/>

    <rect x="30" y="86" width="820" height="132" rx="8" fill="#0D1117" stroke="#1E293B"/>
    <rect x="30" y="86" width="3.5" height="132" fill="url(#wa-accent)"/>
    <text class="m" x="48" y="106" font-size="10.5" fill="#7C3AED" letter-spacing="2.5">IDENTITY</text>

    <g class="m">
      <!-- row 1 -->
      <g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite"
          values="0;0;1;1;0;0" keyTimes="0;0.112;0.126;0.930;0.958;1"/>
        <text class="lbl" x="52"  y="130">name</text>
        <text class="val" x="176" y="130">Krishna Kumar Sharma</text>
      </g>
      <!-- row 2 -->
      <g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite"
          values="0;0;1;1;0;0" keyTimes="0;0.126;0.140;0.930;0.958;1"/>
        <text class="lbl" x="52"  y="152">handle</text>
        <text class="val" x="176" y="152">@Krishnx21</text>
      </g>
      <!-- row 3 -->
      <g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite"
          values="0;0;1;1;0;0" keyTimes="0;0.140;0.154;0.930;0.958;1"/>
        <text class="lbl" x="52"  y="174">role</text>
        <text class="val" x="176" y="174">Full-Stack Engineer</text>
        <text class="m"   x="356" y="174" font-size="13.5" fill="#475569">·</text>
        <text class="val" x="372" y="174">AI/ML Practitioner</text>
      </g>
      <!-- row 4 -->
      <g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite"
          values="0;0;1;1;0;0" keyTimes="0;0.154;0.168;0.930;0.958;1"/>
        <text class="lbl" x="52"  y="196">focus</text>
        <text class="val" x="176" y="196">TypeScript</text>
        <text class="m"   x="270" y="196" font-size="13.5" fill="#475569">/</text>
        <text class="val" x="282" y="196">React</text>
        <text class="m"   x="332" y="196" font-size="13.5" fill="#475569">/</text>
        <text class="val" x="344" y="196">Node</text>
        <text class="m"   x="388" y="196" font-size="13.5" fill="#475569">/</text>
        <text class="val" x="400" y="196">Python</text>
        <text class="m"   x="462" y="196" font-size="13.5" fill="#475569">/</text>
        <text class="val" x="474" y="196">Cloud-Native</text>
      </g>
    </g>

    <!-- live status pill -->
    <g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.168;0.182;0.930;0.958;1"/>
      <rect x="640" y="116" width="192" height="26" rx="13" fill="#071B12" stroke="#14532D"/>
      <circle cx="660" cy="129" r="4" fill="#22C55E" filter="url(#wa-glow)">
        <animate attributeName="opacity" dur="1.8s" repeatCount="indefinite"
                 values="1;0.25;1" keyTimes="0;0.5;1"/>
        <animate attributeName="r" dur="1.8s" repeatCount="indefinite"
                 values="4;5.2;4" keyTimes="0;0.5;1"/>
      </circle>
      <text class="m gn" x="674" y="133" font-size="11">open to collaborate</text>
    </g>
  </g>

  <!-- ============ command 2 ============ -->
  <g class="m">
    <g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.200;0.206;0.930;0.960;1"/>
      <text x="30" y="256" font-size="13.5" class="cy" font-weight="700">krishna@github</text>
      <text x="150" y="256" font-size="13.5" fill="#64748B">:~$</text>
    </g>
    <g clip-path="url(#wa-type2)">
      <text x="200" y="256" class="val" font-weight="700">cat philosophy.txt</text>
    </g>
  </g>

  <!-- philosophy output -->
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
             values="0;0;1;1;0;0" keyTimes="0;0.288;0.305;0.930;0.958;1"/>
    <text class="m" x="30" y="286" font-size="13.5" fill="#A8DADC" font-style="italic">
      "Make it work, make it right, make it fast — then make it look like it was easy."
    </text>
  </g>

  <!-- ============ live prompt + blinking cursor ============ -->
  <g class="m" opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
             values="0;0;1;1;0;0" keyTimes="0;0.325;0.336;0.930;0.958;1"/>
    <text x="30" y="320" font-size="13.5" class="cy" font-weight="700">krishna@github</text>
    <text x="150" y="320" font-size="13.5" fill="#64748B">:~$</text>
    <rect x="200" y="308" width="9" height="16" fill="#00D4FF" filter="url(#wa-glow)">
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite"
               values="1;1;0;0" keyTimes="0;0.5;0.5;1" calcMode="discrete"/>
    </rect>
  </g>

  <!-- ============ status bar ============ -->
  <line x1="1" y1="352" x2="879" y2="352" stroke="#1E293B"/>
  <g class="m" font-size="10.5">
    <text x="30"  y="372" fill="#475569">KSH-OS v2.1</text>
    <text x="140" y="372" fill="#334155">│</text>
    <text x="160" y="372" fill="#00D4FF">uptime: always shipping</text>
    <text x="330" y="372" fill="#334155">│</text>
    <text x="350" y="372" fill="#475569">branch: main</text>
    <text x="850" y="372" fill="#22C55E" text-anchor="end">● ONLINE</text>
  </g>
  <rect x="0" y="388" width="0" height="4" fill="url(#wa-accent)" opacity="0.9">
    <animate attributeName="width" dur="16s" repeatCount="indefinite"
             values="0;880;880;0" keyTimes="0;0.34;0.93;1" calcMode="linear"/>
  </rect>
</svg>
