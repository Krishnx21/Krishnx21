<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes flow {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      
      .cursor { animation: cursor 1s step-end infinite; }
      .flow { animation: flow 2s ease-in-out infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
    
    <linearGradient id="identityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="url(#identityGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="350" fill="url(#grid)" opacity="0.3"/>

  <!-- Terminal Header -->
  <rect x="0" y="0" width="800" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <circle cx="20" cy="20" r="4" fill="#EF4444"/>
  <circle cx="40" cy="20" r="4" fill="#F59E0B"/>
  <circle cx="60" cy="20" r="4" fill="#22C55E"/>
  <text x="80" y="25" class="mono" font-size="11" fill="#64748B">ksh-terminal — identity</text>

  <!-- Terminal Content -->
  <g transform="translate(25, 70)">
    <text x="0" y="0" class="mono" font-size="12" fill="#00D4FF">&gt; whoami</text>
    
    <g transform="translate(20, 25)">
      <text x="0" y="0" class="mono" font-size="11" fill="#64748B">Name:</text>
      <text x="60" y="0" class="mono" font-size="11" fill="#E6EDF3">Krishna Kumar Sharma</text>
      
      <text x="0" y="20" class="mono" font-size="11" fill="#64748B">Role:</text>
      <text x="60" y="20" class="mono" font-size="11" fill="#E6EDF3">Computer Science Engineer</text>
      
      <text x="0" y="40" class="mono" font-size="11" fill="#64748B">Focus:</text>
      <text x="60" y="40" class="mono" font-size="11" fill="#E6EDF3">Backend / Cloud / DevOps</text>
      
      <text x="0" y="60" class="mono" font-size="11" fill="#64748B">Currently:</text>
      <text x="60" y="60" class="mono" font-size="11" fill="#22C55E">Building + Learning + Contributing</text>
    </g>

    <text x="0" y="110" class="mono" font-size="12" fill="#00D4FF">&gt; philosophy</text>
    
    <!-- Engineering Pipeline -->
    <g transform="translate(20, 135)">
      <text x="0" y="0" class="mono" font-size="11" fill="#7C3AED">UNDERSTAND</text>
      <line x1="80" y1="-5" x2="80" y2="15" stroke="#00D4FF" stroke-width="1" class="flow"/>
      
      <text x="0" y="25" class="mono" font-size="11" fill="#7C3AED">DESIGN</text>
      <line x1="60" y1="20" x2="60" y2="40" stroke="#00D4FF" stroke-width="1" class="flow" style="animation-delay: 0.3s;"/>
      
      <text x="0" y="50" class="mono" font-size="11" fill="#7C3AED">BUILD</text>
      <line x1="50" y1="45" x2="50" y2="65" stroke="#00D4FF" stroke-width="1" class="flow" style="animation-delay: 0.6s;"/>
      
      <text x="0" y="75" class="mono" font-size="11" fill="#7C3AED">DEBUG</text>
      <line x1="50" y1="70" x2="50" y2="90" stroke="#00D4FF" stroke-width="1" class="flow" style="animation-delay: 0.9s;"/>
      
      <text x="0" y="100" class="mono" font-size="11" fill="#7C3AED">SHIP</text>
      <line x1="60" y1="95" x2="60" y2="115" stroke="#00D4FF" stroke-width="1" class="flow" style="animation-delay: 1.2s;"/>
      
      <text x="0" y="125" class="mono" font-size="11" fill="#7C3AED">IMPROVE</text>
    </g>

    <text x="0" y="190" class="mono" font-size="12" fill="#00D4FF">&gt; mode<span class="cursor">_</span></text>
  </g>

  <!-- Status Indicator -->
  <g transform="translate(700, 310)">
    <circle cx="0" cy="0" r="8" fill="#22C55E" opacity="0.3" class="pulse"/>
    <circle cx="0" cy="0" r="4" fill="#22C55E"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#22C55E">IDENTITY LOADED</text>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="340" width="800" height="10" fill="url(#accentGradient)"/>
</svg>