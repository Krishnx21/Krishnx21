<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 320" width="736" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="736" height="320" fill="url(#bgGradient)" rx="8"/>
  
  <!-- Subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="736" height="320" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="736" height="40" fill="#161b22" rx="8"/>
  <rect x="0" y="32" width="736" height="8" fill="#161b22"/>
  <text x="20" y="26" class="mono" font-size="14" font-weight="700" fill="#00d4ff">// IDENTITY.DUMP</text>
  <line x1="0" y1="40" x2="736" y2="40" stroke="#1a2332" stroke-width="1"/>

  <!-- Content -->
  <g transform="translate(20, 60)">
    <!-- Name -->
    <text x="0" y="15" class="mono" font-size="11" fill="#8b949e">NAME</text>
    <text x="120" y="15" class="mono" font-size="12" fill="#ffffff">Krishna Kumar Sharma</text>
    <line x1="0" y1="25" x2="680" y2="25" stroke="#1a2332" stroke-width="0.5"/>

    <!-- Role -->
    <text x="0" y="45" class="mono" font-size="11" fill="#8b949e">ROLE</text>
    <text x="120" y="45" class="mono" font-size="12" fill="#ffffff">Backend &amp; Cloud Developer</text>
    <line x1="0" y1="55" x2="680" y2="55" stroke="#1a2332" stroke-width="0.5"/>

    <!-- Focus -->
    <text x="0" y="75" class="mono" font-size="11" fill="#8b949e">FOCUS</text>
    <text x="120" y="75" class="mono" font-size="12" fill="#ffffff">Backend Engineering • Cloud • DevOps • Open Source • DSA • System Design</text>
    <line x1="0" y1="85" x2="680" y2="85" stroke="#1a2332" stroke-width="0.5"/>

    <!-- Philosophy -->
    <text x="0" y="105" class="mono" font-size="11" fill="#8b949e">PHILOSOPHY</text>
    <text x="120" y="105" class="mono" font-size="12" fill="#00d4ff">BUILD → BREAK → DEBUG → LEARN → SHIP</text>
    <line x1="0" y1="115" x2="680" y2="115" stroke="#1a2332" stroke-width="0.5"/>

    <!-- Engineering Approach -->
    <text x="0" y="135" class="mono" font-size="11" fill="#8b949e">APPROACH</text>
    <text x="120" y="135" class="mono" font-size="12" fill="#ffffff">Scalable systems • Clean architecture • Performance optimization</text>
    <line x1="0" y1="145" x2="680" y2="145" stroke="#1a2332" stroke-width="0.5"/>

    <!-- Learning -->
    <text x="0" y="165" class="mono" font-size="11" fill="#8b949e">LEARNING</text>
    <text x="120" y="165" class="mono" font-size="12" fill="#ffffff">System design fundamentals • Cloud architecture • Advanced algorithms</text>
    <line x1="0" y1="175" x2="680" y2="175" stroke="#1a2332" stroke-width="0.5"/>

    <!-- Mode -->
    <text x="0" y="195" class="mono" font-size="11" fill="#8b949e">MODE</text>
    <text x="120" y="195" class="mono" font-size="12" fill="#a371f7">LEARN // BUILD // SHIP</text>
    <line x1="0" y1="205" x2="680" y2="205" stroke="#1a2332" stroke-width="0.5"/>

    <!-- Status -->
    <text x="0" y="225" class="mono" font-size="11" fill="#8b949e">STATUS</text>
    <text x="120" y="225" class="mono" font-size="12" fill="#27ca40">ONLINE • BUILDING SYSTEMS</text>
    <line x1="0" y1="235" x2="680" y2="235" stroke="#1a2332" stroke-width="0.5"/>
  </g>

  <!-- Signature -->
  <text x="20" y="290" class="mono" font-size="11" fill="#8b949e">KSH // BUILD • DEBUG • LEARN • SHIP</text>

  <!-- Bottom border -->
  <rect x="0" y="318" width="736" height="2" fill="#00d4ff"/>
</svg>