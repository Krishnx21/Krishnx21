<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes data-flow {
        0% { transform: translateX(0); opacity: 1; }
        100% { transform: translateX(15px); opacity: 0; }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      .data-flow { animation: data-flow 2s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .rotate { animation: rotate 10s linear infinite; }
    </style>
    
    <linearGradient id="certivaultGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="480" fill="url(#certivaultGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="480" fill="url(#grid)" opacity="0.3"/>

  <!-- Header Zone -->
  <rect x="0" y="0" width="800" height="60" fill="#0B0F17" stroke="#22C55E" stroke-width="1"/>
  <text x="25" y="28" class="mono" font-size="16" font-weight="800" fill="#22C55E">CERTIVAULT // DEPLOYED SYSTEM</text>
  <text x="25" y="48" class="mono" font-size="11" fill="#64748B">SECURE DOCUMENT VERIFICATION PLATFORM</text>
  <text x="750" y="38" text-anchor="end" class="mono" font-size="12" fill="#22C55E">✓ SHIPPED</text>

  <!-- Status Zone -->
  <g transform="translate(680, 28)">
    <circle cx="0" cy="0" r="6" fill="#22C55E" class="pulse"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#22C55E">OPERATIONAL</text>
  </g>

  <!-- Architecture Zone -->
  <g transform="translate(25, 80)">
    <!-- Client -->
    <g transform="translate(300, 0)">
      <rect width="150" height="40" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <text x="75" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">CLIENT</text>
    </g>

    <!-- Connection -->
    <line x1="375" y1="40" x2="375" y2="60" stroke="#00D4FF" stroke-width="2"/>
    <circle cx="375" cy="50" r="3" fill="#00D4FF" class="pulse"/>

    <!-- API -->
    <g transform="translate(300, 60)">
      <rect width="150" height="40" fill="#0B0F17" stroke="#7C3AED" stroke-width="1" rx="4"/>
      <text x="75" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">API_GATEWAY</text>
    </g>

    <!-- Connection -->
    <line x1="375" y1="100" x2="375" y2="120" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="375" cy="110" r="3" fill="#7C3AED" class="pulse"/>

    <!-- Split -->
    <line x1="375" y1="120" x2="250" y2="140" stroke="#22C55E" stroke-width="2"/>
    <line x1="375" y1="120" x2="500" y2="140" stroke="#00D4FF" stroke-width="2"/>

    <!-- Auth -->
    <g transform="translate(150, 140)">
      <rect width="150" height="40" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="75" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">AUTH_SERVICE</text>
    </g>

    <!-- Document Service -->
    <g transform="translate(400, 140)">
      <rect width="200" height="40" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <text x="100" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">DOCUMENT_SERVICE</text>
    </g>

    <!-- Database Group -->
    <g transform="translate(25, 200)">
      <rect width="170" height="40" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="85" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">DATABASE</text>
      <circle cx="150" cy="20" r="3" fill="#22C55E" class="pulse"/>
    </g>

    <g transform="translate(205, 200)">
      <rect width="170" height="40" fill="#0B0F17" stroke="#7C3AED" stroke-width="1" rx="4"/>
      <text x="85" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">REDIS_CACHE</text>
      <circle cx="150" cy="20" r="3" fill="#7C3AED" class="pulse" style="animation-delay: 0.3s;"/>
    </g>

    <g transform="translate(385, 200)">
      <rect width="170" height="40" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <text x="85" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">AWS_S3</text>
      <circle cx="150" cy="20" r="3" fill="#00D4FF" class="pulse" style="animation-delay: 0.6s;"/>
    </g>

    <g transform="translate(565, 200)">
      <rect width="170" height="40" fill="#0B0F17" stroke="#F59E0B" stroke-width="1" rx="4"/>
      <text x="85" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">AUDIT_LOGS</text>
      <circle cx="150" cy="20" r="3" fill="#F59E0B" class="pulse" style="animation-delay: 0.9s;"/>
    </g>

    <!-- Connections from Document Service -->
    <line x1="400" y1="180" x2="112" y2="200" stroke="#22C55E" stroke-width="1" opacity="0.5"/>
    <line x1="450" y1="180" x2="290" y2="200" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>
    <line x1="500" y1="180" x2="470" y2="200" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
    <line x1="550" y1="180" x2="650" y2="200" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>

    <!-- CI/CD -->
    <g transform="translate(300, 260)">
      <rect width="150" height="40" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="75" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">CI/CD</text>
    </g>

    <!-- Monitoring -->
    <g transform="translate(300, 320)">
      <rect width="150" height="40" fill="#0B0F17" stroke="#7C3AED" stroke-width="1" rx="4"/>
      <text x="75" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">MONITORING</text>
    </g>

    <!-- Vertical connections -->
    <line x1="375" y1="240" x2="375" y2="260" stroke="#22C55E" stroke-width="1" opacity="0.5"/>
    <line x1="375" y1="300" x2="375" y2="320" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Features Zone -->
  <g transform="translate(25, 400)">
    <rect width="750" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    <text x="15" y="20" class="mono" font-size="11" fill="#64748B">FEATURES</text>
    <text x="15" y="38" class="mono" font-size="10" fill="#22C55E">VERIFICATION</text>
    <text x="100" y="38" class="mono" font-size="10" fill="#00D4FF">DOCUMENT_MANAGEMENT</text>
    <text x="240" y="38" class="mono" font-size="10" fill="#7C3AED">AUDIT_LOGS</text>
    <text x="330" y="38" class="mono" font-size="10" fill="#F59E0B">CLOUD_STORAGE</text>
    <text x="440" y="38" class="mono" font-size="10" fill="#E6EDF3">SECURITY</text>
    <text x="520" y="38" class="mono" font-size="10" fill="#22C55E">CI/CD</text>
    <text x="580" y="38" class="mono" font-size="10" fill="#7C3AED">MONITORING</text>
    
    <circle cx="730" cy="35" r="4" fill="#22C55E" class="pulse"/>
  </g>

  <!-- Animated ring -->
  <circle cx="400" cy="250" r="180" fill="none" stroke="#22C55E" stroke-width="1" opacity="0.1" class="rotate"/>

  <!-- Bottom Border -->
  <rect x="0" y="475" width="800" height="5" fill="url(#accentGradient)"/>
</svg>