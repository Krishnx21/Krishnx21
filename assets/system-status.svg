<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 280" width="736" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="736" height="280" fill="url(#bgGradient)" rx="8"/>
  
  <!-- Subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="736" height="280" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="736" height="40" fill="#161b22" rx="8"/>
  <rect x="0" y="32" width="736" height="8" fill="#161b22"/>
  <text x="20" y="26" class="mono" font-size="14" font-weight="700" fill="#00d4ff">SYSTEM STATUS</text>
  <line x1="0" y1="40" x2="736" y2="40" stroke="#1a2332" stroke-width="1"/>

  <!-- Status Items -->
  <!-- CertiVault -->
  <g transform="translate(20, 60)">
    <rect width="680" height="30" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="20" class="mono" font-size="12" fill="#ffffff">CERTIVAULT</text>
    <circle cx="600" cy="15" r="5" fill="#e3b341" class="pulse"/>
    <text x="615" y="20" class="mono" font-size="11" fill="#e3b341">BUILDING</text>
  </g>

  <!-- Backend -->
  <g transform="translate(20, 100)">
    <rect width="680" height="30" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="20" class="mono" font-size="12" fill="#ffffff">BACKEND</text>
    <circle cx="600" cy="15" r="5" fill="#27ca40" class="pulse"/>
    <text x="615" y="20" class="mono" font-size="11" fill="#27ca40">ACTIVE</text>
  </g>

  <!-- Cloud -->
  <g transform="translate(20, 140)">
    <rect width="680" height="30" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="20" class="mono" font-size="12" fill="#ffffff">CLOUD</text>
    <circle cx="600" cy="15" r="5" fill="#00d4ff" class="pulse"/>
    <text x="615" y="20" class="mono" font-size="11" fill="#00d4ff">LEARNING</text>
  </g>

  <!-- DevOps -->
  <g transform="translate(20, 180)">
    <rect width="680" height="30" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="20" class="mono" font-size="12" fill="#ffffff">DEVOPS</text>
    <circle cx="600" cy="15" r="5" fill="#8b949e" class="pulse"/>
    <text x="615" y="20" class="mono" font-size="11" fill="#8b949e">EXPLORING</text>
  </g>

  <!-- DSA -->
  <g transform="translate(20, 220)">
    <rect width="680" height="30" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="20" class="mono" font-size="12" fill="#ffffff">DSA</text>
    <circle cx="600" cy="15" r="5" fill="#a371f7" class="pulse"/>
    <text x="615" y="20" class="mono" font-size="11" fill="#a371f7">TRAINING</text>
  </g>

  <!-- Open Source -->
  <g transform="translate(20, 260)">
    <rect width="680" height="30" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="20" class="mono" font-size="12" fill="#ffffff">OPEN SOURCE</text>
    <circle cx="600" cy="15" r="5" fill="#27ca40" class="pulse"/>
    <text x="615" y="20" class="mono" font-size="11" fill="#27ca40">CONTRIBUTING</text>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="278" width="736" height="2" fill="#00d4ff"/>
</svg>