<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes signal {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
      }
      
      .signal { animation: signal 2s ease-in-out infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
    
    <linearGradient id="arsenalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#arsenalGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="420" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="26" class="mono" font-size="14" font-weight="700" fill="#00D4FF">TECHNOLOGY_MATRIX</text>
  <text x="750" y="26" text-anchor="end" class="mono" font-size="11" fill="#64748B">SYSTEM_STACK</text>

  <!-- Technology Grid -->
  <g transform="translate(25, 60)">
    <!-- Languages -->
    <g transform="translate(0, 0)">
      <rect width="170" height="140" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#7C3AED">LANGUAGES</text>
      <line x1="15" y1="35" x2="155" y2="35" stroke="#1E293B" stroke-width="0.5"/>
      <text x="15" y="55" class="mono" font-size="10" fill="#E6EDF3">C++</text>
      <text x="15" y="75" class="mono" font-size="10" fill="#E6EDF3">JavaScript</text>
      <text x="15" y="95" class="mono" font-size="10" fill="#E6EDF3">TypeScript</text>
      <text x="15" y="115" class="mono" font-size="10" fill="#E6EDF3">Python</text>
      <circle cx="150" cy="125" r="3" fill="#7C3AED" class="pulse"/>
    </g>

    <!-- Backend -->
    <g transform="translate(190, 0)">
      <rect width="170" height="140" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#00D4FF">BACKEND</text>
      <line x1="15" y1="35" x2="155" y2="35" stroke="#1E293B" stroke-width="0.5"/>
      <text x="15" y="55" class="mono" font-size="10" fill="#E6EDF3">Node.js</text>
      <text x="15" y="75" class="mono" font-size="10" fill="#E6EDF3">Express.js</text>
      <text x="15" y="95" class="mono" font-size="10" fill="#E6EDF3">REST APIs</text>
      <text x="15" y="115" class="mono" font-size="10" fill="#E6EDF3">Microservices</text>
      <circle cx="150" cy="125" r="3" fill="#00D4FF" class="pulse"/>
    </g>

    <!-- Frontend -->
    <g transform="translate(380, 0)">
      <rect width="170" height="140" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#F59E0B">FRONTEND</text>
      <line x1="15" y1="35" x2="155" y2="35" stroke="#1E293B" stroke-width="0.5"/>
      <text x="15" y="55" class="mono" font-size="10" fill="#E6EDF3">React</text>
      <text x="15" y="75" class="mono" font-size="10" fill="#E6EDF3">HTML/CSS</text>
      <text x="15" y="95" class="mono" font-size="10" fill="#E6EDF3">Tailwind</text>
      <text x="15" y="115" class="mono" font-size="10" fill="#E6EDF3">JavaScript</text>
      <circle cx="150" cy="125" r="3" fill="#F59E0B" class="pulse"/>
    </g>

    <!-- Database -->
    <g transform="translate(570, 0)">
      <rect width="170" height="140" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#22C55E">DATABASE</text>
      <line x1="15" y1="35" x2="155" y2="35" stroke="#1E293B" stroke-width="0.5"/>
      <text x="15" y="55" class="mono" font-size="10" fill="#E6EDF3">MongoDB</text>
      <text x="15" y="75" class="mono" font-size="10" fill="#E6EDF3">PostgreSQL</text>
      <text x="15" y="95" class="mono" font-size="10" fill="#E6EDF3">MySQL</text>
      <text x="15" y="115" class="mono" font-size="10" fill="#E6EDF3">Redis</text>
      <circle cx="150" cy="125" r="3" fill="#22C55E" class="pulse"/>
    </g>

    <!-- Cloud/DevOps -->
    <g transform="translate(0, 160)">
      <rect width="370" height="140" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#00D4FF">CLOUD / DEVOPS</text>
      <line x1="15" y1="35" x2="355" y2="35" stroke="#1E293B" stroke-width="0.5"/>
      <text x="15" y="55" class="mono" font-size="10" fill="#E6EDF3">AWS</text>
      <text x="15" y="75" class="mono" font-size="10" fill="#E6EDF3">Docker</text>
      <text x="15" y="95" class="mono" font-size="10" fill="#E6EDF3">GitHub Actions</text>
      <text x="15" y="115" class="mono" font-size="10" fill="#E6EDF3">Terraform</text>
      <text x="200" y="55" class="mono" font-size="10" fill="#E6EDF3">Kubernetes</text>
      <text x="200" y="75" class="mono" font-size="10" fill="#E6EDF3">CI/CD</text>
      <text x="200" y="95" class="mono" font-size="10" fill="#E6EDF3">Linux</text>
      <circle cx="340" cy="125" r="3" fill="#00D4FF" class="pulse"/>
    </g>

    <!-- Tools -->
    <g transform="translate(390, 160)">
      <rect width="350" height="140" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#7C3AED">TOOLS</text>
      <line x1="15" y1="35" x2="335" y2="35" stroke="#1E293B" stroke-width="0.5"/>
      <text x="15" y="55" class="mono" font-size="10" fill="#E6EDF3">Git</text>
      <text x="15" y="75" class="mono" font-size="10" fill="#E6EDF3">GitHub</text>
      <text x="15" y="95" class="mono" font-size="10" fill="#E6EDF3">VS Code</text>
      <text x="15" y="115" class="mono" font-size="10" fill="#E6EDF3">Postman</text>
      <text x="200" y="55" class="mono" font-size="10" fill="#E6EDF3">Linux Terminal</text>
      <text x="200" y="75" class="mono" font-size="10" fill="#E6EDF3">Swagger</text>
      <text x="200" y="95" class="mono" font-size="10" fill="#E6EDF3">Jest</text>
      <circle cx="320" cy="125" r="3" fill="#7C3AED" class="pulse"/>
    </g>

    <!-- Signal Connections -->
    <line x1="170" y1="125" x2="190" y2="125" stroke="#00D4FF" stroke-width="1" class="signal"/>
    <line x1="360" y1="125" x2="380" y2="125" stroke="#7C3AED" stroke-width="1" class="signal" style="animation-delay: 0.5s;"/>
    <line x1="550" y1="125" x2="570" y2="125" stroke="#22C55E" stroke-width="1" class="signal" style="animation-delay: 1s;"/>
    <line x1="185" y1="230" x2="390" y2="230" stroke="#00D4FF" stroke-width="1" class="signal" style="animation-delay: 1.5s;"/>
  </g>

  <!-- Status -->
  <g transform="translate(700, 380)">
    <circle cx="0" cy="0" r="5" fill="#22C55E" class="pulse"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#22C55E">STACK ACTIVE</text>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="400" width="800" height="20" fill="url(#accentGradient)"/>
</svg>