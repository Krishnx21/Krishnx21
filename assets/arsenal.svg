<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 380" width="736" height="380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="736" height="380" fill="url(#bgGradient)" rx="8"/>
  
  <!-- Subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="736" height="380" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="736" height="40" fill="#161b22" rx="8"/>
  <rect x="0" y="32" width="736" height="8" fill="#161b22"/>
  <text x="20" y="26" class="mono" font-size="14" font-weight="700" fill="#00d4ff">// TECH_ARSENAL</text>
  <line x1="0" y1="40" x2="736" y2="40" stroke="#1a2332" stroke-width="1"/>

  <!-- Languages Section -->
  <g transform="translate(20, 60)">
    <rect width="220" height="140" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#a371f7">LANGUAGES</text>
    <line x1="15" y1="35" x2="205" y2="35" stroke="#1a2332" stroke-width="0.5"/>
    <text x="15" y="55" class="mono" font-size="11" fill="#ffffff">C++</text>
    <text x="15" y="75" class="mono" font-size="11" fill="#ffffff">JavaScript</text>
    <text x="15" y="95" class="mono" font-size="11" fill="#ffffff">TypeScript</text>
    <text x="15" y="115" class="mono" font-size="11" fill="#ffffff">Python</text>
  </g>

  <!-- Backend Section -->
  <g transform="translate(258, 60)">
    <rect width="220" height="140" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#00d4ff">BACKEND</text>
    <line x1="15" y1="35" x2="205" y2="35" stroke="#1a2332" stroke-width="0.5"/>
    <text x="15" y="55" class="mono" font-size="11" fill="#ffffff">Node.js</text>
    <text x="15" y="75" class="mono" font-size="11" fill="#ffffff">Express.js</text>
    <text x="15" y="95" class="mono" font-size="11" fill="#ffffff">REST APIs</text>
    <text x="15" y="115" class="mono" font-size="11" fill="#ffffff">Microservices</text>
  </g>

  <!-- Database Section -->
  <g transform="translate(496, 60)">
    <rect width="220" height="140" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#27ca40">DATABASE</text>
    <line x1="15" y1="35" x2="205" y2="35" stroke="#1a2332" stroke-width="0.5"/>
    <text x="15" y="55" class="mono" font-size="11" fill="#ffffff">MongoDB</text>
    <text x="15" y="75" class="mono" font-size="11" fill="#ffffff">PostgreSQL</text>
    <text x="15" y="95" class="mono" font-size="11" fill="#ffffff">Redis</text>
    <text x="15" y="115" class="mono" font-size="11" fill="#ffffff">SQL</text>
  </g>

  <!-- Frontend Section -->
  <g transform="translate(20, 220)">
    <rect width="220" height="140" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#e3b341">FRONTEND</text>
    <line x1="15" y1="35" x2="205" y2="35" stroke="#1a2332" stroke-width="0.5"/>
    <text x="15" y="55" class="mono" font-size="11" fill="#ffffff">React</text>
    <text x="15" y="75" class="mono" font-size="11" fill="#ffffff">HTML/CSS</text>
    <text x="15" y="95" class="mono" font-size="11" fill="#ffffff">JavaScript</text>
    <text x="15" y="115" class="mono" font-size="11" fill="#ffffff">Responsive Design</text>
  </g>

  <!-- Cloud Section -->
  <g transform="translate(258, 220)">
    <rect width="220" height="140" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#00d4ff">CLOUD</text>
    <line x1="15" y1="35" x2="205" y2="35" stroke="#1a2332" stroke-width="0.5"/>
    <text x="15" y="55" class="mono" font-size="11" fill="#ffffff">AWS</text>
    <text x="15" y="75" class="mono" font-size="11" fill="#ffffff">Docker</text>
    <text x="15" y="95" class="mono" font-size="11" fill="#ffffff">Kubernetes</text>
    <text x="15" y="115" class="mono" font-size="11" fill="#ffffff">Cloud Architecture</text>
  </g>

  <!-- DevOps Section -->
  <g transform="translate(496, 220)">
    <rect width="220" height="140" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#ff5f56">DEVOPS</text>
    <line x1="15" y1="35" x2="205" y2="35" stroke="#1a2332" stroke-width="0.5"/>
    <text x="15" y="55" class="mono" font-size="11" fill="#ffffff">GitHub Actions</text>
    <text x="15" y="75" class="mono" font-size="11" fill="#ffffff">Terraform</text>
    <text x="15" y="95" class="mono" font-size="11" fill="#ffffff">CI/CD</text>
    <text x="15" y="115" class="mono" font-size="11" fill="#ffffff">Infrastructure as Code</text>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="378" width="736" height="2" fill="#00d4ff"/>
</svg>