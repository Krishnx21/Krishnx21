<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', sans-serif; }
      
      @keyframes skill-bar {
        from { width: 0; }
        to { width: var(--skill-width); }
      }
      
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes icon-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      
      @keyframes glow-pulse {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.3)); }
        50% { filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.6)); }
      }
      
      .skill-bar { animation: skill-bar 1.5s ease-out forwards; }
      .fade-in { animation: fade-in 0.5s ease-out forwards; }
      .icon-float { animation: icon-float 3s ease-in-out infinite; }
      .glow-pulse { animation: glow-pulse 2s ease-in-out infinite; }
    </style>
    
    <linearGradient id="arsenalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    
    <linearGradient id="skillGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    
    <linearGradient id="categoryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#arsenalGradient)" rx="12"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="500" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" rx="12"/>
  <rect y="52" width="800" height="8" fill="#161b22"/>
  
  <text x="25" y="38" class="mono" font-size="16" font-weight="800" fill="#00d4ff">// TECH_ARSENAL</text>
  <text x="750" y="38" text-anchor="end" class="mono" font-size="12" fill="#8b949e">EQUIPMENT_LOADOUT</text>
  
  <line x1="0" y1="60" x2="800" y2="60" stroke="#1a2332" stroke-width="1"/>

  <!-- Skills Grid -->
  <g transform="translate(25, 80)">
    <!-- Languages -->
    <g transform="translate(0, 0)" class="fade-in" style="animation-delay: 0.1s;">
      <rect width="220" height="180" fill="url(#categoryGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <text x="20" y="30" class="mono" font-size="12" font-weight="700" fill="#a371f7">LANGUAGES</text>
      <line x1="20" y1="40" x2="200" y2="40" stroke="#1a2332" stroke-width="0.5"/>
      
      <g transform="translate(20, 60)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">C++</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="100" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 100px;"/>
      </g>
      
      <g transform="translate(20, 85)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">JavaScript</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="110" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 110px; animation-delay: 0.2s;"/>
      </g>
      
      <g transform="translate(20, 110)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">TypeScript</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="95" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 95px; animation-delay: 0.3s;"/>
      </g>
      
      <g transform="translate(20, 135)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">Python</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="85" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 85px; animation-delay: 0.4s;"/>
      </g>
    </g>

    <!-- Backend -->
    <g transform="translate(245, 0)" class="fade-in" style="animation-delay: 0.2s;">
      <rect width="220" height="180" fill="url(#categoryGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <text x="20" y="30" class="mono" font-size="12" font-weight="700" fill="#00d4ff">BACKEND</text>
      <line x1="20" y1="40" x2="200" y2="40" stroke="#1a2332" stroke-width="0.5"/>
      
      <g transform="translate(20, 60)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">Node.js</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="105" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 105px; animation-delay: 0.5s;"/>
      </g>
      
      <g transform="translate(20, 85)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">Express.js</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="100" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 100px; animation-delay: 0.6s;"/>
      </g>
      
      <g transform="translate(20, 110)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">REST APIs</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="110" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 110px; animation-delay: 0.7s;"/>
      </g>
      
      <g transform="translate(20, 135)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">Microservices</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="80" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 80px; animation-delay: 0.8s;"/>
      </g>
    </g>

    <!-- Database -->
    <g transform="translate(490, 0)" class="fade-in" style="animation-delay: 0.3s;">
      <rect width="220" height="180" fill="url(#categoryGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <text x="20" y="30" class="mono" font-size="12" font-weight="700" fill="#27ca40">DATABASE</text>
      <line x1="20" y1="40" x2="200" y2="40" stroke="#1a2332" stroke-width="0.5"/>
      
      <g transform="translate(20, 60)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">MongoDB</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="100" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 100px; animation-delay: 0.9s;"/>
      </g>
      
      <g transform="translate(20, 85)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">PostgreSQL</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="90" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 90px; animation-delay: 1.0s;"/>
      </g>
      
      <g transform="translate(20, 110)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">Redis</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="75" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 75px; animation-delay: 1.1s;"/>
      </g>
      
      <g transform="translate(20, 135)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">SQL</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="95" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 95px; animation-delay: 1.2s;"/>
      </g>
    </g>

    <!-- Frontend -->
    <g transform="translate(0, 200)" class="fade-in" style="animation-delay: 0.4s;">
      <rect width="220" height="180" fill="url(#categoryGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <text x="20" y="30" class="mono" font-size="12" font-weight="700" fill="#e3b341">FRONTEND</text>
      <line x1="20" y1="40" x2="200" y2="40" stroke="#1a2332" stroke-width="0.5"/>
      
      <g transform="translate(20, 60)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">React</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="90" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 90px; animation-delay: 1.3s;"/>
      </g>
      
      <g transform="translate(20, 85)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">HTML/CSS</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="115" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 115px; animation-delay: 1.4s;"/>
      </g>
      
      <g transform="translate(20, 110)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">JavaScript</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="110" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 110px; animation-delay: 1.5s;"/>
      </g>
      
      <g transform="translate(20, 135)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">Responsive Design</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="100" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 100px; animation-delay: 1.6s;"/>
      </g>
    </g>

    <!-- Cloud -->
    <g transform="translate(245, 200)" class="fade-in" style="animation-delay: 0.5s;">
      <rect width="220" height="180" fill="url(#categoryGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <text x="20" y="30" class="mono" font-size="12" font-weight="700" fill="#00d4ff">CLOUD</text>
      <line x1="20" y1="40" x2="200" y2="40" stroke="#1a2332" stroke-width="0.5"/>
      
      <g transform="translate(20, 60)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">AWS</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="70" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 70px; animation-delay: 1.7s;"/>
      </g>
      
      <g transform="translate(20, 85)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">Docker</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="85" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 85px; animation-delay: 1.8s;"/>
      </g>
      
      <g transform="translate(20, 110)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">Kubernetes</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="60" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 60px; animation-delay: 1.9s;"/>
      </g>
      
      <g transform="translate(20, 135)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">Cloud Architecture</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="65" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 65px; animation-delay: 2.0s;"/>
      </g>
    </g>

    <!-- DevOps -->
    <g transform="translate(490, 200)" class="fade-in" style="animation-delay: 0.6s;">
      <rect width="220" height="180" fill="url(#categoryGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <text x="20" y="30" class="mono" font-size="12" font-weight="700" fill="#ff5f56">DEVOPS</text>
      <line x1="20" y1="40" x2="200" y2="40" stroke="#1a2332" stroke-width="0.5"/>
      
      <g transform="translate(20, 60)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">GitHub Actions</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="90" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 90px; animation-delay: 2.1s;"/>
      </g>
      
      <g transform="translate(20, 85)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">Terraform</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="65" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 65px; animation-delay: 2.2s;"/>
      </g>
      
      <g transform="translate(20, 110)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">CI/CD</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="85" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 85px; animation-delay: 2.3s;"/>
      </g>
      
      <g transform="translate(20, 135)">
        <text x="0" y="0" class="sans" font-size="11" fill="#ffffff">Infrastructure as Code</text>
        <rect x="60" y="-8" width="120" height="6" fill="#0d1117" rx="3"/>
        <rect x="60" y="-8" width="70" height="6" fill="url(#skillGradient)" rx="3" class="skill-bar" style="--skill-width: 70px; animation-delay: 2.4s;"/>
      </g>
    </g>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="498" width="800" height="2" fill="url(#skillGradient)"/>
</svg>