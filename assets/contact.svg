<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes signal-wave {
        0% { r: 4; opacity: 1; }
        100% { r: 20; opacity: 0; }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      
      .signal-wave { animation: signal-wave 2s ease-out infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .blink { animation: blink 1.5s ease-in-out infinite; }
    </style>
    
    <linearGradient id="contactGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="280" fill="url(#contactGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="280" fill="url(#grid)" opacity="0.3"/>

  <!-- Header Zone -->
  <rect x="0" y="0" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="32" class="mono" font-size="14" font-weight="700" fill="#00D4FF">SIGNAL // CONTACT</text>
  <text x="750" y="32" text-anchor="end" class="mono" font-size="11" fill="#64748B">COMMUNICATION</text>

  <!-- Signal Status Zone -->
  <g transform="translate(700, 30)">
    <circle cx="0" cy="0" r="4" fill="#22C55E" class="pulse"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#22C55E">AVAILABLE</text>
  </g>

  <!-- Contact Nodes Zone -->
  <g transform="translate(100, 100)">
    <!-- GitHub -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="30" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" class="mono" font-size="10" fill="#E6EDF3">GITHUB</text>
      <circle cx="0" cy="0" r="4" fill="#22C55E" class="signal-wave"/>
    </g>

    <!-- LinkedIn -->
    <g transform="translate(120, 0)">
      <circle cx="0" cy="0" r="30" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" class="mono" font-size="10" fill="#E6EDF3">LINKEDIN</text>
      <circle cx="0" cy="0" r="4" fill="#00D4FF" class="signal-wave" style="animation-delay: 0.5s;"/>
    </g>

    <!-- LeetCode -->
    <g transform="translate(240, 0)">
      <circle cx="0" cy="0" r="30" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" class="mono" font-size="10" fill="#E6EDF3">LEETCODE</text>
      <circle cx="0" cy="0" r="4" fill="#F59E0B" class="signal-wave" style="animation-delay: 1s;"/>
    </g>

    <!-- Email -->
    <g transform="translate(360, 0)">
      <circle cx="0" cy="0" r="30" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" class="mono" font-size="10" fill="#E6EDF3">EMAIL</text>
      <circle cx="0" cy="0" r="4" fill="#7C3AED" class="signal-wave" style="animation-delay: 1.5s;"/>
    </g>
  </g>

  <!-- Connection Lines Zone -->
  <g transform="translate(100, 100)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
    <line x1="30" y1="0" x2="60" y2="0" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
    <line x1="60" y1="0" x2="90" y2="0" stroke="#F59E0B" stroke-width="1" opacity="0.3"/>
    <line x1="90" y1="0" x2="120" y2="0" stroke="#22C55E" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Terminal Command Zone -->
  <g transform="translate(25, 180)">
    <rect width="750" height="60" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" fill="#64748B">&gt; signal --contact</text>
    <text x="15" y="45" class="mono" font-size="10" fill="#E6EDF3">Establishing secure communication channel...</text>
    
    <circle cx="700" cy="35" r="4" fill="#22C55E" class="blink"/>
  </g>

  <!-- Status Zone -->
  <g transform="translate(700, 260)">
    <circle cx="0" cy="0" r="4" fill="#22C55E" class="pulse"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#22C55E">SIGNAL_ACTIVE</text>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="275" width="800" height="5" fill="url(#accentGradient)"/>
</svg>