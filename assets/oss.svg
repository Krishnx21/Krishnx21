<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', sans-serif; }
      
      @keyframes counter-up {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes pulse-icon {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      
      @keyframes float-card {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      
      .counter-up { animation: counter-up 0.5s ease-out forwards; }
      .pulse-icon { animation: pulse-icon 2s ease-in-out infinite; }
      .float-card { animation: float-card 4s ease-in-out infinite; }
    </style>
    
    <linearGradient id="ossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    
    <linearGradient id="ossAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ca40"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#ossGradient)" rx="12"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="300" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" rx="12"/>
  <rect y="52" width="800" height="8" fill="#161b22"/>
  
  <text x="25" y="38" class="mono" font-size="16" font-weight="800" fill="#27ca40">// OPEN_SOURCE</text>
  <text x="750" y="38" text-anchor="end" class="mono" font-size="12" fill="#8b949e">CONTRIBUTIONS</text>
  
  <line x1="0" y1="60" x2="800" y2="60" stroke="#1a2332" stroke-width="1"/>

  <!-- Stats Cards -->
  <g transform="translate(25, 80)">
    <!-- Contributions -->
    <g transform="translate(0, 0)" class="float-card counter-up" style="animation-delay: 0.1s;">
      <rect width="170" height="100" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <text x="85" y="30" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">CONTRIBUTIONS</text>
      <text x="85" y="60" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#27ca40">500+</text>
      <text x="85" y="80" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">Total commits</text>
    </g>

    <!-- Pull Requests -->
    <g transform="translate(190, 0)" class="float-card counter-up" style="animation-delay: 0.2s;">
      <rect width="170" height="100" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <text x="85" y="30" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">PULL REQUESTS</text>
      <text x="85" y="60" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#a371f7">50+</text>
      <text x="85" y="80" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">Merged</text>
    </g>

    <!-- Issues -->
    <g transform="translate(380, 0)" class="float-card counter-up" style="animation-delay: 0.3s;">
      <rect width="170" height="100" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <text x="85" y="30" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">ISSUES</text>
      <text x="85" y="60" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#e3b341">30+</text>
      <text x="85" y="80" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">Closed</text>
    </g>

    <!-- Code Reviews -->
    <g transform="translate(570, 0)" class="float-card counter-up" style="animation-delay: 0.4s;">
      <rect width="170" height="100" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <text x="85" y="30" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">CODE REVIEWS</text>
      <text x="85" y="60" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#00d4ff">100+</text>
      <text x="85" y="80" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">Reviews</text>
    </g>
  </g>

  <!-- Focus Areas -->
  <g transform="translate(25, 200)">
    <rect width="730" height="60" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
    <text x="20" y="25" class="mono" font-size="11" font-weight="700" fill="#27ca40">CONTRIBUTION FOCUS</text>
    <line x1="20" y1="35" x2="710" y2="35" stroke="#1a2332" stroke-width="0.5"/>
    
    <g transform="translate(20, 45)">
      <rect width="120" height="20" fill="#0d1117" rx="4"/>
      <text x="60" y="14" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">Backend Systems</text>
    </g>
    
    <g transform="translate(150, 45)">
      <rect width="120" height="20" fill="#0d1117" rx="4"/>
      <text x="60" y="14" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">Cloud Infra</text>
    </g>
    
    <g transform="translate(280, 45)">
      <rect width="120" height="20" fill="#0d1117" rx="4"/>
      <text x="60" y="14" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">DevOps Tools</text>
    </g>
    
    <g transform="translate(410, 45)">
      <rect width="120" height="20" fill="#0d1117" rx="4"/>
      <text x="60" y="14" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">Documentation</text>
    </g>
    
    <g transform="translate(540, 45)">
      <rect width="120" height="20" fill="#0d1117" rx="4"/>
      <text x="60" y="14" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">Bug Fixes</text>
    </g>
  </g>

  <!-- Status Indicator -->
  <g transform="translate(700, 275)">
    <circle cx="0" cy="0" r="8" fill="#27ca40" opacity="0.3" class="pulse-icon"/>
    <circle cx="0" cy="0" r="4" fill="#27ca40"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#27ca40">ACTIVE</text>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="298" width="800" height="2" fill="url(#ossAccent)"/>
</svg>