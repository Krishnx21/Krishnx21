<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="900" height="30">
  <defs>
    <style>
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      
      @keyframes scan {
        0% { transform: translateX(-100%); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateX(100%); opacity: 0; }
      }
      
      .dash { animation: dash 20s linear infinite; }
      .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
      .scan { animation: scan 3s linear infinite; }
    </style>
    
    <linearGradient id="dividerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#05060B;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#00D4FF;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#7C3AED;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#05060B;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="30" fill="#05060B"/>

  <!-- Main Line -->
  <line x1="0" y1="15" x2="900" y2="15" stroke="url(#dividerGradient)" stroke-width="1" class="dash"/>

  <!-- Center Accent -->
  <circle cx="450" cy="15" r="4" fill="#00D4FF" class="pulse-glow"/>
  <circle cx="450" cy="15" r="8" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Side Accents -->
  <circle cx="420" cy="15" r="2" fill="#7C3AED" opacity="0.5"/>
  <circle cx="480" cy="15" r="2" fill="#7C3AED" opacity="0.5"/>
  
  <!-- Scan Line -->
  <rect x="0" y="13" width="900" height="4" fill="url(#dividerGradient)" class="scan" opacity="0.2"/>
  
  <!-- Corner Accents -->
  <circle cx="50" cy="15" r="1" fill="#00D4FF" opacity="0.3"/>
  <circle cx="850" cy="15" r="1" fill="#7C3AED" opacity="0.3"/>
</svg>