<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="100%" height="100%">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#06b6d4" opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#8b5cf6" opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.1" />
    </linearGradient>

    <filter id="divGlow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Horizontal Line -->
  <line x1="40" y1="15" x2="860" y2="15" stroke="url(#divGrad)" stroke-width="1.5" filter="url(#divGlow)"/>

  <!-- Left Crosshair -->
  <path d="M 25 15 L 35 15 M 30 10 L 30 20" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
  <!-- Right Crosshair -->
  <path d="M 865 15 L 875 15 M 870 10 L 870 20" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>

  <!-- Center Hex/Diamond Node -->
  <polygon points="450,8 457,15 450,22 443,15" fill="#080c14" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="450" cy="15" r="2" fill="#38bdf8"/>
</svg>
