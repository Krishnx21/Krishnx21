<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="800" height="20">
  <defs>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0e17;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0e17;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="20" fill="#0a0e17"/>

  <!-- Center accent line -->
  <line x1="0" y1="10" x2="800" y2="10" stroke="url(#lineGradient)" stroke-width="1"/>
  
  <!-- Small accent dots -->
  <circle cx="400" cy="10" r="2" fill="#00d4ff"/>
  <circle cx="380" cy="10" r="1" fill="#00d4ff" opacity="0.5"/>
  <circle cx="420" cy="10" r="1" fill="#00d4ff" opacity="0.5"/>
</svg>