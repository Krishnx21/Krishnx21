<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes scan {
        0% { transform: translateY(-100%); opacity: 0; }
        50% { opacity: 0.3; }
        100% { transform: translateY(100%); opacity: 0; }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      .cursor { animation: cursor 1s step-end infinite; }
      .scan { animation: scan 3s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
    
    <linearGradient id="terminalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="350" fill="url(#terminalGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="350" fill="url(#grid)" opacity="0.3"/>

  <!-- Terminal Window Zone -->
  <rect x="25" y="25" width="750" height="350" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
  
  <!-- Terminal Header Zone -->
  <rect x="25" y="25" width="750" height="35" fill="#05060B" stroke="#1E293B" stroke-width="1" rx="4"/>
  <circle cx="45" cy="42" r="4" fill="#EF4444"/>
  <circle cx="65" cy="42" r="4" fill="#F59E0B"/>
  <circle cx="85" cy="42" r="4" fill="#22C55E"/>
  <text x="100" y="47" class="mono" font-size="11" fill="#64748B">ksh-terminal — bash</text>

  <!-- Terminal Content Zone -->
  <g transform="translate(45, 85)">
    <text x="0" y="0" class="mono" font-size="12" fill="#00D4FF">$ whoami</text>
    <text x="0" y="25" class="mono" font-size="11" fill="#E6EDF3">Krishna Kumar Sharma</text>
    
    <text x="0" y="55" class="mono" font-size="12" fill="#00D4FF">$ role</text>
    <text x="0" y="80" class="mono" font-size="11" fill="#E6EDF3">Backend / Cloud Engineer</text>
    
    <text x="0" y="110" class="mono" font-size="12" fill="#00D4FF">$ current_project</text>
    <text x="0" y="135" class="mono" font-size="11" fill="#F59E0B">OpsPilot</text>
    
    <text x="0" y="165" class="mono" font-size="12" fill="#00D4FF">$ shipped</text>
    <text x="0" y="190" class="mono" font-size="11" fill="#22C55E">CertiVault</text>
    
    <text x="0" y="220" class="mono" font-size="12" fill="#00D4FF">$ focus</text>
    <text x="0" y="245" class="mono" font-size="11" fill="#E6EDF3">DSA + Backend + Cloud</text>
    
    <text x="0" y="275" class="mono" font-size="12" fill="#00D4FF">$ philosophy</text>
    <text x="0" y="300" class="mono" font-size="11" fill="#7C3AED">BUILD → DEBUG → LEARN → SHIP</text>
    
    <text x="0" y="330" class="mono" font-size="12" fill="#00D4FF">$ contributions</text>
    <text x="0" y="355" class="mono" font-size="11" fill="#22C55E">GSSOC Contributor • ECSOC Project Admin</text>
    
    <text x="0" y="385" class="mono" font-size="12" fill="#00D4FF">$ status<span class="cursor">_</span></text>
  </g>

  <!-- Scan line -->
  <rect x="25" y="60" width="750" height="2" fill="url(#accentGradient)" class="scan" opacity="0.3"/>

  <!-- Status Zone -->
  <g transform="translate(700, 335)">
    <circle cx="0" cy="0" r="5" fill="#22C55E" class="pulse"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#22C55E">TERMINAL_READY</text>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="345" width="800" height="5" fill="url(#accentGradient)"/>
</svg>