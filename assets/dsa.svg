<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes flow {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      .flow { animation: flow 2s ease-in-out infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .rotate { animation: rotate 8s linear infinite; }
    </style>
    
    <linearGradient id="dsaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="420" fill="url(#dsaGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="420" fill="url(#grid)" opacity="0.3"/>

  <!-- Header Zone -->
  <rect x="0" y="0" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="32" class="mono" font-size="14" font-weight="700" fill="#00D4FF">ALGORITHM LAB</text>
  <text x="750" y="32" text-anchor="end" class="mono" font-size="11" fill="#64748B">DSA_TRAINING</text>

  <!-- Topics Zone -->
  <g transform="translate(25, 70)">
    <rect width="370" height="180" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#7C3AED">CORE_TOPICS</text>
    <line x1="15" y1="35" x2="355" y2="35" stroke="#1E293B" stroke-width="0.5"/>
    
    <text x="15" y="55" class="mono" font-size="10" fill="#E6EDF3">ARRAYS</text>
    <text x="15" y="75" class="mono" font-size="10" fill="#E6EDF3">STRINGS</text>
    <text x="15" y="95" class="mono" font-size="10" fill="#E6EDF3">HASHING</text>
    <text x="15" y="115" class="mono" font-size="10" fill="#E6EDF3">SORTING</text>
    <text x="15" y="135" class="mono" font-size="10" fill="#E6EDF3">LINKED_LIST</text>
    <text x="15" y="155" class="mono" font-size="10" fill="#E6EDF3">STACK_QUEUE</text>
    <text x="15" y="175" class="mono" font-size="10" fill="#E6EDF3">RECURSION</text>
    
    <circle cx="340" cy="50" r="3" fill="#22C55E" class="pulse"/>
    <circle cx="340" cy="70" r="3" fill="#22C55E" class="pulse" style="animation-delay: 0.2s;"/>
    <circle cx="340" cy="90" r="3" fill="#F59E0B" class="pulse" style="animation-delay: 0.4s;"/>
    <circle cx="340" cy="110" r="3" fill="#22C55E" class="pulse" style="animation-delay: 0.6s;"/>
    <circle cx="340" cy="130" r="3" fill="#F59E0B" class="pulse" style="animation-delay: 0.8s;"/>
    <circle cx="340" cy="150" r="3" fill="#7C3AED" class="pulse" style="animation-delay: 1s;"/>
    <circle cx="340" cy="170" r="3" fill="#7C3AED" class="pulse" style="animation-delay: 1.2s;"/>
  </g>

  <g transform="translate(405, 70)">
    <rect width="370" height="180" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#00D4FF">ADVANCED</text>
    <line x1="15" y1="35" x2="355" y2="35" stroke="#1E293B" stroke-width="0.5"/>
    
    <text x="15" y="55" class="mono" font-size="10" fill="#E6EDF3">TREES</text>
    <text x="15" y="75" class="mono" font-size="10" fill="#E6EDF3">GRAPHS</text>
    <text x="15" y="95" class="mono" font-size="10" fill="#E6EDF3">DYNAMIC_PROGRAMMING</text>
    <text x="15" y="115" class="mono" font-size="10" fill="#E6EDF3">GREEDY</text>
    <text x="15" y="135" class="mono" font-size="10" fill="#E6EDF3">BACKTRACKING</text>
    <text x="15" y="155" class="mono" font-size="10" fill="#E6EDF3">BINARY_SEARCH</text>
    <text x="15" y="175" class="mono" font-size="10" fill="#E6EDF3">BIT_MANIPULATION</text>
    
    <circle cx="340" cy="50" r="3" fill="#7C3AED" class="pulse" style="animation-delay: 1.4s;"/>
    <circle cx="340" cy="70" r="3" fill="#7C3AED" class="pulse" style="animation-delay: 1.6s;"/>
    <circle cx="340" cy="90" r="3" fill="#7C3AED" class="pulse" style="animation-delay: 1.8s;"/>
    <circle cx="340" cy="110" r="3" fill="#64748B" class="pulse" style="animation-delay: 2s;"/>
    <circle cx="340" cy="130" r="3" fill="#64748B" class="pulse" style="animation-delay: 2.2s;"/>
    <circle cx="340" cy="150" r="3" fill="#64748B" class="pulse" style="animation-delay: 2.4s;"/>
    <circle cx="340" cy="170" r="3" fill="#64748B" class="pulse" style="animation-delay: 2.6s;"/>
  </g>

  <!-- Methodology Zone -->
  <g transform="translate(25, 270)">
    <rect width="750" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    <text x="15" y="20" class="mono" font-size="11" font-weight="700" fill="#00D4FF">LEARNING_METHODOLOGY</text>
    
    <text x="15" y="38" class="mono" font-size="10" fill="#E6EDF3">CONCEPT</text>
    <text x="75" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="90" y="38" class="mono" font-size="10" fill="#E6EDF3">WHY?</text>
    <text x="130" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="145" y="38" class="mono" font-size="10" fill="#E6EDF3">WHEN?</text>
    <text x="190" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="205" y="38" class="mono" font-size="10" fill="#E6EDF3">PATTERN</text>
    <text x="260" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="275" y="38" class="mono" font-size="10" fill="#E6EDF3">OBSERVATION</text>
    <text x="355" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="370" y="38" class="mono" font-size="10" fill="#E6EDF3">APPROACH</text>
    <text x="430" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="445" y="38" class="mono" font-size="10" fill="#E6EDF3">CODE</text>
    <text x="485" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="500" y="38" class="mono" font-size="10" fill="#E6EDF3">REVISION</text>
    
    <circle cx="730" cy="35" r="4" fill="#7C3AED" class="pulse"/>
  </g>

  <!-- Status Zone -->
  <rect x="0" y="330" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="360" class="mono" font-size="11" fill="#64748B">TRAINING STATUS: <tspan fill="#7C3AED">ACTIVE</tspan></text>
  <text x="750" y="360" text-anchor="end" class="mono" font-size="11" fill="#64748B">ALGORITHM_CORE</text>

  <!-- Bottom Border -->
  <rect x="0" y="415" width="800" height="5" fill="url(#accentGradient)"/>
</svg>