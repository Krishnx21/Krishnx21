<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', sans-serif; }
      
      @keyframes skill-pop {
        0% { transform: scale(0.8); opacity: 0; }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      
      @keyframes progress-ring {
        from { stroke-dashoffset: 283; }
        to { stroke-dashoffset: var(--offset); }
      }
      
      @keyframes float-up {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      
      .skill-pop { animation: skill-pop 0.5s ease-out forwards; }
      .progress-ring { animation: progress-ring 2s ease-out forwards; }
      .float-up { animation: float-up 3s ease-in-out infinite; }
    </style>
    
    <linearGradient id="dsaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    
    <linearGradient id="dsaAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a371f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#dsaGradient)" rx="12"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="400" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" rx="12"/>
  <rect y="52" width="800" height="8" fill="#161b22"/>
  
  <text x="25" y="38" class="mono" font-size="16" font-weight="800" fill="#a371f7">// TRAINING_ARC</text>
  <text x="750" y="38" text-anchor="end" class="mono" font-size="12" fill="#8b949e">DSA + SYSTEM_DESIGN</text>
  
  <line x1="0" y1="60" x2="800" y2="60" stroke="#1a2332" stroke-width="1"/>

  <!-- Overall Progress -->
  <g transform="translate(25, 80)">
    <rect width="730" height="80" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
    <text x="20" y="30" class="mono" font-size="12" font-weight="700" fill="#ffffff">TRAINING PROGRESS</text>
    
    <g transform="translate(20, 50)">
      <rect width="690" height="16" fill="#0d1117" rx="8"/>
      <rect width="345" height="16" fill="url(#dsaAccent)" rx="8" class="skill-pop"/>
      <text x="345" y="12" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">50%</text>
    </g>
    
    <text x="680" y="30" class="mono" font-size="10" fill="#a371f7">IN PROGRESS</text>
  </g>

  <!-- Skills Grid -->
  <g transform="translate(25, 180)">
    <!-- Array/Strings -->
    <g transform="translate(0, 0)" class="float-up" style="animation-delay: 0.1s;">
      <rect width="110" height="40" fill="url(#cardGradient)" stroke="#27ca40" stroke-width="1" rx="6"/>
      <text x="55" y="25" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">ARRAYS</text>
      <circle cx="100" cy="20" r="4" fill="#27ca40"/>
    </g>

    <g transform="translate(125, 0)" class="float-up" style="animation-delay: 0.2s;">
      <rect width="110" height="40" fill="url(#cardGradient)" stroke="#27ca40" stroke-width="1" rx="6"/>
      <text x="55" y="25" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">STRINGS</text>
      <circle cx="100" cy="20" r="4" fill="#27ca40"/>
    </g>

    <g transform="translate(250, 0)" class="float-up" style="animation-delay: 0.3s;">
      <rect width="110" height="40" fill="url(#cardGradient)" stroke="#e3b341" stroke-width="1" rx="6"/>
      <text x="55" y="25" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">HASHING</text>
      <circle cx="100" cy="20" r="4" fill="#e3b341"/>
    </g>

    <g transform="translate(375, 0)" class="float-up" style="animation-delay: 0.4s;">
      <rect width="110" height="40" fill="url(#cardGradient)" stroke="#27ca40" stroke-width="1" rx="6"/>
      <text x="55" y="25" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">SORTING</text>
      <circle cx="100" cy="20" r="4" fill="#27ca40"/>
    </g>

    <g transform="translate(500, 0)" class="float-up" style="animation-delay: 0.5s;">
      <rect width="110" height="40" fill="url(#cardGradient)" stroke="#e3b341" stroke-width="1" rx="6"/>
      <text x="55" y="25" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">RECURSION</text>
      <circle cx="100" cy="20" r="4" fill="#e3b341"/>
    </g>

    <g transform="translate(625, 0)" class="float-up" style="animation-delay: 0.6s;">
      <rect width="110" height="40" fill="url(#cardGradient)" stroke="#27ca40" stroke-width="1" rx="6"/>
      <text x="55" y="25" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">LINKED_LIST</text>
      <circle cx="100" cy="20" r="4" fill="#27ca40"/>
    </g>

    <!-- Second Row -->
    <g transform="translate(0, 55)" class="float-up" style="animation-delay: 0.7s;">
      <rect width="110" height="40" fill="url(#cardGradient)" stroke="#27ca40" stroke-width="1" rx="6"/>
      <text x="55" y="25" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">STACKS</text>
      <circle cx="100" cy="20" r="4" fill="#27ca40"/>
    </g>

    <g transform="translate(125, 55)" class="float-up" style="animation-delay: 0.8s;">
      <rect width="110" height="40" fill="url(#cardGradient)" stroke="#27ca40" stroke-width="1" rx="6"/>
      <text x="55" y="25" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">QUEUES</text>
      <circle cx="100" cy="20" r="4" fill="#27ca40"/>
    </g>

    <g transform="translate(250, 55)" class="float-up" style="animation-delay: 0.9s;">
      <rect width="110" height="40" fill="url(#cardGradient)" stroke="#e3b341" stroke-width="1" rx="6"/>
      <text x="55" y="25" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">TREES</text>
      <circle cx="100" cy="20" r="4" fill="#e3b341"/>
    </g>

    <g transform="translate(375, 55)" class="float-up" style="animation-delay: 1.0s;">
      <rect width="110" height="40" fill="url(#cardGradient)" stroke="#a371f7" stroke-width="1" rx="6"/>
      <text x="55" y="25" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">GRAPHS</text>
      <circle cx="100" cy="20" r="4" fill="#a371f7"/>
    </g>

    <g transform="translate(500, 55)" class="float-up" style="animation-delay: 1.1s;">
      <rect width="110" height="40" fill="url(#cardGradient)" stroke="#a371f7" stroke-width="1" rx="6"/>
      <text x="55" y="25" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">DP</text>
      <circle cx="100" cy="20" r="4" fill="#a371f7"/>
    </g>

    <g transform="translate(625, 55)" class="float-up" style="animation-delay: 1.2s;">
      <rect width="110" height="40" fill="url(#cardGradient)" stroke="#8b949e" stroke-width="1" rx="6"/>
      <text x="55" y="25" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">GREEDY</text>
      <circle cx="100" cy="20" r="4" fill="#8b949e"/>
    </g>
  </g>

  <!-- Philosophy -->
  <g transform="translate(25, 310)">
    <rect width="730" height="50" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
    <text x="20" y="20" class="mono" font-size="11" font-weight="700" fill="#a371f7">APPROACH</text>
    <text x="20" y="38" class="mono" font-size="10" fill="#8b949e">CONCEPT → PATTERN → APPROACH → OBSERVATION → TIME → SPACE</text>
  </g>

  <!-- Legend -->
  <g transform="translate(25, 370)">
    <circle cx="0" cy="0" r="4" fill="#27ca40"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#27ca40">MASTERED</text>
    
    <circle cx="100" cy="0" r="4" fill="#e3b341"/>
    <text x="115" y="4" class="mono" font-size="10" fill="#e3b341">PRACTICING</text>
    
    <circle cx="200" cy="0" r="4" fill="#a371f7"/>
    <text x="215" y="4" class="mono" font-size="10" fill="#a371f7">LEARNING</text>
    
    <circle cx="300" cy="0" r="4" fill="#8b949e"/>
    <text x="315" y="4" class="mono" font-size="10" fill="#8b949e">TO_LEARN</text>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="398" width="800" height="2" fill="url(#dsaAccent)"/>
</svg>