<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .blink { animation: blink 1.5s ease-in-out infinite; }
    </style>
    
    <linearGradient id="systemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="350" fill="url(#systemGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="350" fill="url(#grid)" opacity="0.3"/>

  <!-- Header Zone -->
  <rect x="0" y="0" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="32" class="mono" font-size="14" font-weight="700" fill="#00D4FF">KSH // SYSTEM STATUS</text>
  <text x="750" y="32" text-anchor="end" class="mono" font-size="11" fill="#64748B">LIVE MONITORING</text>

  <!-- System Items Zone -->
  <g transform="translate(25, 70)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="11" fill="#64748B">BACKEND</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">● ACTIVE</text>
      <circle cx="340" cy="22" r="4" fill="#22C55E" class="pulse"/>
    </g>

    <g transform="translate(375, 0)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="11" fill="#64748B">DSA</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">● TRAINING</text>
      <circle cx="340" cy="22" r="4" fill="#7C3AED" class="pulse"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 60)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="11" fill="#64748B">CLOUD</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">● LEARNING</text>
      <circle cx="340" cy="22" r="4" fill="#00D4FF" class="blink"/>
    </g>

    <g transform="translate(375, 60)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="11" fill="#64748B">DEVOPS</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">● EXPLORING</text>
      <circle cx="340" cy="22" r="4" fill="#64748B" class="blink"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 120)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="11" fill="#64748B">OPEN SOURCE</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">● CONTRIBUTING</text>
      <circle cx="340" cy="22" r="4" fill="#22C55E" class="pulse"/>
    </g>

    <g transform="translate(375, 120)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="11" fill="#64748B">CERTIVAULT</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">✓ SHIPPED</text>
      <circle cx="340" cy="22" r="4" fill="#22C55E" class="pulse"/>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 180)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="11" fill="#64748B">OPSPILOT</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">◐ IN DEVELOPMENT</text>
      <circle cx="340" cy="22" r="4" fill="#F59E0B" class="blink"/>
    </g>

    <g transform="translate(375, 180)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="11" fill="#22C55E">SYSTEM OVERALL</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#22C55E">● OPERATIONAL</text>
      <circle cx="340" cy="22" r="4" fill="#22C55E" class="pulse"/>
    </g>
  </g>

  <!-- Status Bar Zone -->
  <rect x="0" y="300" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="330" class="mono" font-size="11" fill="#64748B">SYSTEM STATUS: <tspan fill="#22C55E">OPERATIONAL</tspan></text>
  <text x="750" y="330" text-anchor="end" class="mono" font-size="11" fill="#64748B">KSH-OS v2.0</text>

  <!-- Bottom Border -->
  <rect x="0" y="345" width="800" height="5" fill="url(#accentGradient)"/>
</svg>