<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      
      @keyframes scan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .blink { animation: blink 1.5s ease-in-out infinite; }
      .scan { animation: scan 3s linear infinite; }
    </style>
    
    <linearGradient id="systemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="statusGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#systemGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="300" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="32" class="mono" font-size="14" font-weight="700" fill="#00D4FF">SYSTEM STATUS</text>
  <text x="750" y="32" text-anchor="end" class="mono" font-size="11" fill="#64748B">LIVE MONITORING</text>
  
  <!-- Scan line -->
  <rect x="0" y="0" width="800" height="2" fill="url(#statusGradient)" class="scan" opacity="0.3"/>

  <!-- Status Items -->
  <g transform="translate(25, 70)">
    <!-- Backend -->
    <g transform="translate(0, 0)">
      <rect width="350" height="35" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="22" class="mono" font-size="12" fill="#E6EDF3">BACKEND</text>
      <circle cx="320" cy="17" r="5" fill="#22C55E" class="pulse"/>
      <text x="330" y="21" class="mono" font-size="10" fill="#22C55E">ACTIVE</text>
    </g>

    <!-- CertiVault -->
    <g transform="translate(375, 0)">
      <rect width="350" height="35" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="22" class="mono" font-size="12" fill="#E6EDF3">CERTIVAULT</text>
      <circle cx="320" cy="17" r="5" fill="#F59E0B" class="blink"/>
      <text x="330" y="21" class="mono" font-size="10" fill="#F59E0B">BUILDING</text>
    </g>

    <!-- DSA -->
    <g transform="translate(0, 50)">
      <rect width="350" height="35" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="22" class="mono" font-size="12" fill="#E6EDF3">DSA</text>
      <circle cx="320" cy="17" r="5" fill="#7C3AED" class="pulse"/>
      <text x="330" y="21" class="mono" font-size="10" fill="#7C3AED">TRAINING</text>
    </g>

    <!-- Open Source -->
    <g transform="translate(375, 50)">
      <rect width="350" height="35" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="22" class="mono" font-size="12" fill="#E6EDF3">OPEN SOURCE</text>
      <circle cx="320" cy="17" r="5" fill="#22C55E" class="pulse"/>
      <text x="330" y="21" class="mono" font-size="10" fill="#22C55E">CONTRIBUTING</text>
    </g>

    <!-- Cloud -->
    <g transform="translate(0, 100)">
      <rect width="350" height="35" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="22" class="mono" font-size="12" fill="#E6EDF3">CLOUD</text>
      <circle cx="320" cy="17" r="5" fill="#00D4FF" class="blink"/>
      <text x="330" y="21" class="mono" font-size="10" fill="#00D4FF">LEARNING</text>
    </g>

    <!-- DevOps -->
    <g transform="translate(375, 100)">
      <rect width="350" height="35" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="22" class="mono" font-size="12" fill="#E6EDF3">DEVOPS</text>
      <circle cx="320" cy="17" r="5" fill="#64748B" class="blink"/>
      <text x="330" y="21" class="mono" font-size="10" fill="#64748B">EXPLORING</text>
    </g>

    <!-- System Design -->
    <g transform="translate(0, 150)">
      <rect width="350" height="35" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="22" class="mono" font-size="12" fill="#E6EDF3">SYSTEM DESIGN</text>
      <circle cx="320" cy="17" r="5" fill="#00D4FF" class="blink"/>
      <text x="330" y="21" class="mono" font-size="10" fill="#00D4FF">LEARNING</text>
    </g>

    <!-- Overall Status -->
    <g transform="translate(375, 150)">
      <rect width="350" height="35" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="15" y="22" class="mono" font-size="12" fill="#22C55E">SYSTEM OVERALL</text>
      <circle cx="320" cy="17" r="5" fill="#22C55E" class="pulse"/>
      <text x="330" y="21" class="mono" font-size="10" fill="#22C55E">OPERATIONAL</text>
    </g>
  </g>

  <!-- Bottom Status Bar -->
  <rect x="0" y="270" width="800" height="30" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="290" class="mono" font-size="10" fill="#64748B">UPTIME: <tspan fill="#22C55E">BUILDING</tspan></text>
  <text x="750" y="290" text-anchor="end" class="mono" font-size="10" fill="#64748B">KSH-OS v1.0</text>
</svg>