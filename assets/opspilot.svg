<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes data-flow {
        0% { transform: translateX(0); opacity: 1; }
        100% { transform: translateX(15px); opacity: 0; }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      
      .data-flow { animation: data-flow 2s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .rotate { animation: rotate 10s linear infinite; }
      .blink { animation: blink 1.5s ease-in-out infinite; }
    </style>
    
    <linearGradient id="opspilotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="450" fill="url(#opspilotGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)" opacity="0.3"/>

  <!-- Header Zone -->
  <rect x="0" y="0" width="800" height="60" fill="#0B0F17" stroke="#F59E0B" stroke-width="1"/>
  <text x="25" y="28" class="mono" font-size="16" font-weight="800" fill="#F59E0B">OPSPILOT // ACTIVE BUILD</text>
  <text x="25" y="48" class="mono" font-size="11" fill="#64748B">AI-POWERED DEVOPS / ENGINEERING ASSISTANT</text>
  <text x="750" y="38" text-anchor="end" class="mono" font-size="12" fill="#F59E0B">◐ IN DEVELOPMENT</text>

  <!-- Status Zone -->
  <g transform="translate(660, 28)">
    <circle cx="0" cy="0" r="6" fill="#F59E0B" class="blink"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#F59E0B">BUILDING</text>
  </g>

  <!-- Architecture Zone -->
  <g transform="translate(25, 80)">
    <!-- User -->
    <g transform="translate(300, 0)">
      <rect width="150" height="40" fill="#0B0F17" stroke="#7C3AED" stroke-width="1" rx="4"/>
      <text x="75" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">USER</text>
    </g>

    <!-- Connection -->
    <line x1="375" y1="40" x2="375" y2="60" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="375" cy="50" r="3" fill="#7C3AED" class="pulse"/>

    <!-- AI Agent -->
    <g transform="translate(300, 60)">
      <rect width="150" height="40" fill="#0B0F17" stroke="#F59E0B" stroke-width="1" rx="4"/>
      <text x="75" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">AI_AGENT</text>
    </g>

    <!-- Connection -->
    <line x1="375" y1="100" x2="375" y2="120" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="375" cy="110" r="3" fill="#F59E0B" class="pulse"/>

    <!-- Tools -->
    <g transform="translate(150, 120)">
      <rect width="400" height="40" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <text x="200" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">TOOLS_INTEGRATION</text>
    </g>

    <!-- Tool Group -->
    <g transform="translate(25, 180)">
      <rect width="170" height="40" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="85" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">GITHUB</text>
      <circle cx="150" cy="20" r="3" fill="#22C55E" class="pulse"/>
    </g>

    <g transform="translate(205, 180)">
      <rect width="170" height="40" fill="#0B0F17" stroke="#7C3AED" stroke-width="1" rx="4"/>
      <text x="85" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">CI/CD</text>
      <circle cx="150" cy="20" r="3" fill="#7C3AED" class="pulse" style="animation-delay: 0.3s;"/>
    </g>

    <g transform="translate(385, 180)">
      <rect width="170" height="40" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <text x="85" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">LOGS</text>
      <circle cx="150" cy="20" r="3" fill="#00D4FF" class="pulse" style="animation-delay: 0.6s;"/>
    </g>

    <g transform="translate(565, 180)">
      <rect width="170" height="40" fill="#0B0F17" stroke="#F59E0B" stroke-width="1" rx="4"/>
      <text x="85" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">MONITORING</text>
      <circle cx="150" cy="20" r="3" fill="#F59E0B" class="pulse" style="animation-delay: 0.9s;"/>
    </g>

    <!-- Connections from Tools -->
    <line x1="200" y1="160" x2="112" y2="180" stroke="#22C55E" stroke-width="1" opacity="0.5"/>
    <line x1="250" y1="160" x2="290" y2="180" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>
    <line x1="300" y1="160" x2="470" y2="180" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
    <line x1="350" y1="160" x2="650" y2="180" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>

    <!-- Analysis -->
    <g transform="translate(300, 240)">
      <rect width="150" height="40" fill="#0B0F17" stroke="#7C3AED" stroke-width="1" rx="4"/>
      <text x="75" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">ANALYSIS</text>
    </g>

    <!-- Recommendation -->
    <g transform="translate(300, 300)">
      <rect width="150" height="40" fill="#0B0F17" stroke="#F59E0B" stroke-width="1" rx="4"/>
      <text x="75" y="25" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">RECOMMENDATION</text>
    </g>

    <!-- Vertical connections -->
    <line x1="375" y1="220" x2="375" y2="240" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>
    <line x1="375" y1="280" x2="375" y2="300" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Description Zone -->
  <g transform="translate(25, 380)">
    <rect width="750" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    <text x="15" y="20" class="mono" font-size="11" fill="#64748B">SYSTEM TYPE</text>
    <text x="15" y="38" class="mono" font-size="10" fill="#F59E0B">AI-POWERED DEVOPS ASSISTANT</text>
    <text x="250" y="38" class="mono" font-size="10" fill="#7C3AED">AUTOMATED INFRASTRUCTURE ANALYSIS</text>
    <text x="480" y="38" class="mono" font-size="10" fill="#00D4FF">INTELLIGENT RECOMMENDATIONS</text>
    
    <circle cx="730" cy="35" r="4" fill="#F59E0B" class="blink"/>
  </g>

  <!-- Animated ring -->
  <circle cx="400" cy="230" r="160" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.1" class="rotate"/>

  <!-- Bottom Border -->
  <rect x="0" y="445" width="800" height="5" fill="url(#accentGradient)"/>
</svg>