<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;family=Inter:wght@400;600;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', sans-serif; }
      
      @keyframes slide-in {
        from { transform: translateX(-50px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      
      @keyframes glow-pulse {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.5)); }
        50% { filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.8)); }
      }
      
      @keyframes status-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      
      @keyframes float-card {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      
      .slide-in { animation: slide-in 0.6s ease-out forwards; }
      .glow-pulse { animation: glow-pulse 2s ease-in-out infinite; }
      .status-blink { animation: status-blink 1.5s ease-in-out infinite; }
      .float-card { animation: float-card 4s ease-in-out infinite; }
    </style>
    
    <linearGradient id="projectsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    
    <filter id="card-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#projectsGradient)" rx="12"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="400" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" rx="12"/>
  <rect y="52" width="800" height="8" fill="#161b22"/>
  
  <text x="25" y="38" class="mono" font-size="16" font-weight="800" fill="#00d4ff">// FEATURED_PROJECTS</text>
  <text x="750" y="38" text-anchor="end" class="mono" font-size="12" fill="#8b949e">DEPLOYED_UNITS</text>
  
  <line x1="0" y1="60" x2="800" y2="60" stroke="#1a2332" stroke-width="1"/>

  <!-- Project Cards -->
  <g transform="translate(25, 80)">
    <!-- CertiVault -->
    <g transform="translate(0, 0)" class="float-card" style="animation-delay: 0s;">
      <rect width="360" height="100" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8" filter="url(#card-glow)"/>
      <rect x="0" y="0" width="4" height="100" fill="#e3b341" rx="2"/>
      
      <text x="20" y="30" class="mono" font-size="14" font-weight="700" fill="#ffffff">01 // CERTIVAULT</text>
      <text x="20" y="55" class="sans" font-size="12" fill="#8b949e">Secure document management platform</text>
      
      <g transform="translate(20, 75)">
        <rect width="80" height="20" fill="#0d1117" rx="4"/>
        <text x="40" y="14" text-anchor="middle" class="mono" font-size="10" fill="#e3b341" class="status-blink">BUILDING</text>
      </g>
      
      <circle cx="340" cy="20" r="4" fill="#e3b341" class="status-blink"/>
    </g>

    <!-- Smart File Sharing -->
    <g transform="translate(390, 0)" class="float-card" style="animation-delay: 0.5s;">
      <rect width="360" height="100" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8" filter="url(#card-glow)"/>
      <rect x="0" y="0" width="4" height="100" fill="#27ca40" rx="2"/>
      
      <text x="20" y="30" class="mono" font-size="14" font-weight="700" fill="#ffffff">02 // SMART_FILE_SHARING</text>
      <text x="20" y="55" class="sans" font-size="12" fill="#8b949e">Cloud-based document sharing system</text>
      
      <g transform="translate(20, 75)">
        <rect width="80" height="20" fill="#0d1117" rx="4"/>
        <text x="40" y="14" text-anchor="middle" class="mono" font-size="10" fill="#27ca40">ACTIVE</text>
      </g>
      
      <circle cx="340" cy="20" r="4" fill="#27ca40"/>
    </g>

    <!-- AI Resume Analyzer -->
    <g transform="translate(0, 120)" class="float-card" style="animation-delay: 1s;">
      <rect width="360" height="100" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8" filter="url(#card-glow)"/>
      <rect x="0" y="0" width="4" height="100" fill="#a371f7" rx="2"/>
      
      <text x="20" y="30" class="mono" font-size="14" font-weight="700" fill="#ffffff">03 // AI_RESUME_ANALYZER</text>
      <text x="20" y="55" class="sans" font-size="12" fill="#8b949e">AI-assisted resume analysis / ATS</text>
      
      <g transform="translate(20, 75)">
        <rect width="80" height="20" fill="#0d1117" rx="4"/>
        <text x="40" y="14" text-anchor="middle" class="mono" font-size="10" fill="#a371f7">LEARNING</text>
      </g>
      
      <circle cx="340" cy="20" r="4" fill="#a371f7"/>
    </g>

    <!-- AI Customer Service -->
    <g transform="translate(390, 120)" class="float-card" style="animation-delay: 1.5s;">
      <rect width="360" height="100" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8" filter="url(#card-glow)"/>
      <rect x="0" y="0" width="4" height="100" fill="#00d4ff" rx="2"/>
      
      <text x="20" y="30" class="mono" font-size="14" font-weight="700" fill="#ffffff">04 // AI_CUSTOMER_SERVICE</text>
      <text x="20" y="55" class="sans" font-size="12" fill="#8b949e">AI + human customer service platform</text>
      
      <g transform="translate(20, 75)">
        <rect width="80" height="20" fill="#0d1117" rx="4"/>
        <text x="40" y="14" text-anchor="middle" class="mono" font-size="10" fill="#00d4ff">EXPLORING</text>
      </g>
      
      <circle cx="340" cy="20" r="4" fill="#00d4ff"/>
    </g>

    <!-- OpsPilot -->
    <g transform="translate(0, 240)" class="float-card" style="animation-delay: 2s;">
      <rect width="360" height="100" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8" filter="url(#card-glow)"/>
      <rect x="0" y="0" width="4" height="100" fill="#ff5f56" rx="2"/>
      
      <text x="20" y="30" class="mono" font-size="14" font-weight="700" fill="#ffffff">05 // OPSPILOT</text>
      <text x="20" y="55" class="sans" font-size="12" fill="#8b949e">AI-powered DevOps assistant</text>
      
      <g transform="translate(20, 75)">
        <rect width="80" height="20" fill="#0d1117" rx="4"/>
        <text x="40" y="14" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">PLANNED</text>
      </g>
      
      <circle cx="340" cy="20" r="4" fill="#8b949e"/>
    </g>

    <!-- Open Source -->
    <g transform="translate(390, 240)" class="float-card" style="animation-delay: 2.5s;">
      <rect width="360" height="100" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8" filter="url(#card-glow)"/>
      <rect x="0" y="0" width="4" height="100" fill="#27ca40" rx="2"/>
      
      <text x="20" y="30" class="mono" font-size="14" font-weight="700" fill="#ffffff">06 // OPEN_SOURCE</text>
      <text x="20" y="55" class="sans" font-size="12" fill="#8b949e">Community contributions &amp; projects</text>
      
      <g transform="translate(20, 75)">
        <rect width="80" height="20" fill="#0d1117" rx="4"/>
        <text x="40" y="14" text-anchor="middle" class="mono" font-size="10" fill="#27ca40" class="status-blink">ACTIVE</text>
      </g>
      
      <circle cx="340" cy="20" r="4" fill="#27ca40" class="status-blink"/>
    </g>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="398" width="800" height="2" fill="url(#accentGradient)"/>
</svg>