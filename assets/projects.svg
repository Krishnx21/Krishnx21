<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .blink { animation: blink 1.5s ease-in-out infinite; }
    </style>
    
    <linearGradient id="projectsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="380" fill="url(#projectsGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="380" fill="url(#grid)" opacity="0.3"/>

  <!-- Header Zone -->
  <rect x="0" y="0" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="32" class="mono" font-size="14" font-weight="700" fill="#00D4FF">PROJECT DEPLOYMENT GRID</text>
  <text x="750" y="32" text-anchor="end" class="mono" font-size="11" fill="#64748B">DEPLOYED_SYSTEMS</text>

  <!-- Project Nodes Zone -->
  <g transform="translate(25, 70)">
    <!-- CertiVault -->
    <g transform="translate(0, 0)">
      <rect width="730" height="50" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="4" height="50" fill="#22C55E" rx="2"/>
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#E6EDF3">CERTIVAULT</text>
      <text x="20" y="38" class="mono" font-size="10" fill="#22C55E">✓ SHIPPED</text>
      <circle cx="700" cy="25" r="4" fill="#22C55E" class="pulse"/>
    </g>

    <!-- OpsPilot -->
    <g transform="translate(0, 65)">
      <rect width="730" height="50" fill="#0B0F17" stroke="#F59E0B" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="4" height="50" fill="#F59E0B" rx="2"/>
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#E6EDF3">OPSPILOT</text>
      <text x="20" y="38" class="mono" font-size="10" fill="#F59E0B">◐ IN DEVELOPMENT</text>
      <circle cx="700" cy="25" r="4" fill="#F59E0B" class="blink"/>
    </g>

    <!-- AI Resume Analyzer -->
    <g transform="translate(0, 130)">
      <rect width="730" height="50" fill="#0B0F17" stroke="#7C3AED" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="4" height="50" fill="#7C3AED" rx="2"/>
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#E6EDF3">AI RESUME ANALYZER</text>
      <text x="20" y="38" class="mono" font-size="10" fill="#7C3AED">◇ PROJECT</text>
      <circle cx="700" cy="25" r="4" fill="#7C3AED" class="blink"/>
    </g>

    <!-- AI Customer Service -->
    <g transform="translate(0, 195)">
      <rect width="730" height="50" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="4" height="50" fill="#00D4FF" rx="2"/>
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#E6EDF3">AI CUSTOMER SERVICE</text>
      <text x="20" y="38" class="mono" font-size="10" fill="#00D4FF">◇ EXPLORING</text>
      <circle cx="700" cy="25" r="4" fill="#00D4FF" class="blink"/>
    </g>

    <!-- Smart File Sharing -->
    <g transform="translate(0, 260)">
      <rect width="730" height="50" fill="#0B0F17" stroke="#64748B" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="4" height="50" fill="#64748B" rx="2"/>
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#E6EDF3">SMART FILE SHARING</text>
      <text x="20" y="38" class="mono" font-size="10" fill="#64748B">○ PLANNED / PROJECT</text>
      <circle cx="700" cy="25" r="4" fill="#64748B" class="blink"/>
    </g>
  </g>

  <!-- Status Zone -->
  <rect x="0" y="330" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="360" class="mono" font-size="11" fill="#64748B">DEPLOYMENT STATUS: <tspan fill="#22C55E">1 SHIPPED</tspan> <tspan fill="#F59E0B">1 IN DEVELOPMENT</tspan> <tspan fill="#7C3AED">2 PROJECT</tspan> <tspan fill="#00D4FF">1 EXPLORING</tspan></text>
  <text x="750" y="360" text-anchor="end" class="mono" font-size="11" fill="#64748B">5 TOTAL</text>

  <!-- Bottom Border -->
  <rect x="0" y="375" width="800" height="5" fill="url(#accentGradient)"/>
</svg>