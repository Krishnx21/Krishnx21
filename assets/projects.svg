<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 340" width="736" height="340">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="736" height="340" fill="url(#bgGradient)" rx="8"/>
  
  <!-- Subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="736" height="340" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="736" height="40" fill="#161b22" rx="8"/>
  <rect x="0" y="32" width="736" height="8" fill="#161b22"/>
  <text x="20" y="26" class="mono" font-size="14" font-weight="700" fill="#00d4ff">// DEPLOYED_SYSTEMS</text>
  <line x1="0" y1="40" x2="736" y2="40" stroke="#1a2332" stroke-width="1"/>

  <!-- Project Cards -->
  <!-- CertiVault -->
  <g transform="translate(20, 60)">
    <rect width="680" height="50" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <rect x="0" y="0" width="4" height="50" fill="#e3b341" rx="2"/>
    <text x="20" y="20" class="mono" font-size="13" font-weight="700" fill="#ffffff">CERTIVAULT</text>
    <text x="20" y="38" class="mono" font-size="10" fill="#8b949e">Secure document management and verification platform</text>
    <circle cx="600" cy="25" r="5" fill="#e3b341"/>
    <text x="615" y="29" class="mono" font-size="10" fill="#e3b341">BUILDING</text>
  </g>

  <!-- Smart File Sharing -->
  <g transform="translate(20, 125)">
    <rect width="680" height="50" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <rect x="0" y="0" width="4" height="50" fill="#27ca40" rx="2"/>
    <text x="20" y="20" class="mono" font-size="13" font-weight="700" fill="#ffffff">SMART FILE SHARING</text>
    <text x="20" y="38" class="mono" font-size="10" fill="#8b949e">Cloud-based document sharing system</text>
    <circle cx="600" cy="25" r="5" fill="#27ca40"/>
    <text x="615" y="29" class="mono" font-size="10" fill="#27ca40">ACTIVE</text>
  </g>

  <!-- AI Resume Analyzer -->
  <g transform="translate(20, 190)">
    <rect width="680" height="50" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <rect x="0" y="0" width="4" height="50" fill="#a371f7" rx="2"/>
    <text x="20" y="20" class="mono" font-size="13" font-weight="700" fill="#ffffff">AI RESUME ANALYZER</text>
    <text x="20" y="38" class="mono" font-size="10" fill="#8b949e">AI-assisted resume analysis / ATS project</text>
    <circle cx="600" cy="25" r="5" fill="#a371f7"/>
    <text x="615" y="29" class="mono" font-size="10" fill="#a371f7">LEARNING</text>
  </g>

  <!-- AI Customer Service -->
  <g transform="translate(20, 255)">
    <rect width="680" height="50" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <rect x="0" y="0" width="4" height="50" fill="#00d4ff" rx="2"/>
    <text x="20" y="20" class="mono" font-size="13" font-weight="700" fill="#ffffff">AI CUSTOMER SERVICE</text>
    <text x="20" y="38" class="mono" font-size="10" fill="#8b949e">AI + human customer service platform</text>
    <circle cx="600" cy="25" r="5" fill="#00d4ff"/>
    <text x="615" y="29" class="mono" font-size="10" fill="#00d4ff">EXPLORING</text>
  </g>

  <!-- OpsPilot -->
  <g transform="translate(20, 320)">
    <rect width="320" height="50" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <rect x="0" y="0" width="4" height="50" fill="#ff5f56" rx="2"/>
    <text x="20" y="20" class="mono" font-size="13" font-weight="700" fill="#ffffff">OPSPILOT</text>
    <text x="20" y="38" class="mono" font-size="10" fill="#8b949e">AI-powered DevOps assistant</text>
    <circle cx="240" cy="25" r="5" fill="#8b949e"/>
    <text x="255" y="29" class="mono" font-size="10" fill="#8b949e">PLANNED</text>
  </g>

  <!-- Open Source -->
  <g transform="translate(380, 320)">
    <rect width="320" height="50" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <rect x="0" y="0" width="4" height="50" fill="#27ca40" rx="2"/>
    <text x="20" y="20" class="mono" font-size="13" font-weight="700" fill="#ffffff">OPEN SOURCE</text>
    <text x="20" y="38" class="mono" font-size="10" fill="#8b949e">Community contributions</text>
    <circle cx="240" cy="25" r="5" fill="#27ca40"/>
    <text x="255" y="29" class="mono" font-size="10" fill="#27ca40">ACTIVE</text>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="338" width="736" height="2" fill="#00d4ff"/>
</svg>