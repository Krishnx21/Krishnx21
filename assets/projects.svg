<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .rotate { animation: rotate 10s linear infinite; }
      .blink { animation: blink 1.5s ease-in-out infinite; }
    </style>
    
    <linearGradient id="projectsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" fill="url(#projectsGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="380" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="45" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="28" class="mono" font-size="14" font-weight="700" fill="#00D4FF">PROJECT_COMMAND_CENTER</text>
  <text x="750" y="28" text-anchor="end" class="mono" font-size="11" fill="#64748B">DEPLOYED_SYSTEMS</text>

  <!-- Project Nodes -->
  <g transform="translate(25, 65)">
    <!-- CertiVault -->
    <g transform="translate(0, 0)">
      <rect width="730" height="50" fill="#0B0F17" stroke="#F59E0B" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="4" height="50" fill="#F59E0B" rx="2"/>
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#E6EDF3">[01] CERTIVAULT</text>
      <text x="20" y="38" class="mono" font-size="10" fill="#64748B">STATUS: <tspan fill="#F59E0B">BUILDING</tspan></text>
      <circle cx="700" cy="25" r="5" fill="#F59E0B" class="blink"/>
    </g>

    <!-- OpsPilot -->
    <g transform="translate(0, 65)">
      <rect width="730" height="50" fill="#0B0F17" stroke="#64748B" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="4" height="50" fill="#64748B" rx="2"/>
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#E6EDF3">[02] OPSPILOT</text>
      <text x="20" y="38" class="mono" font-size="10" fill="#64748B">STATUS: <tspan fill="#64748B">PLANNED</tspan></text>
      <circle cx="700" cy="25" r="5" fill="#64748B" class="blink"/>
    </g>

    <!-- AI Resume Analyzer -->
    <g transform="translate(0, 130)">
      <rect width="730" height="50" fill="#0B0F17" stroke="#7C3AED" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="4" height="50" fill="#7C3AED" rx="2"/>
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#E6EDF3">[03] AI RESUME ANALYZER</text>
      <text x="20" y="38" class="mono" font-size="10" fill="#64748B">STATUS: <tspan fill="#7C3AED">PROJECT</tspan></text>
      <circle cx="700" cy="25" r="5" fill="#7C3AED" class="blink"/>
    </g>

    <!-- AI Customer Service -->
    <g transform="translate(0, 195)">
      <rect width="730" height="50" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="4" height="50" fill="#00D4FF" rx="2"/>
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#E6EDF3">[04] AI CUSTOMER SERVICE</text>
      <text x="20" y="38" class="mono" font-size="10" fill="#64748B">STATUS: <tspan fill="#00D4FF">EXPLORATION</tspan></text>
      <circle cx="700" cy="25" r="5" fill="#00D4FF" class="blink"/>
    </g>

    <!-- Smart File Sharing -->
    <g transform="translate(0, 260)">
      <rect width="730" height="50" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="4" height="50" fill="#22C55E" rx="2"/>
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#E6EDF3">[05] SMART FILE SHARING</text>
      <text x="20" y="38" class="mono" font-size="10" fill="#64748B">STATUS: <tspan fill="#22C55E">ACTIVE</tspan></text>
      <circle cx="700" cy="25" r="5" fill="#22C55E" class="pulse"/>
    </g>
  </g>

  <!-- Connection Network -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="3" fill="#00D4FF" class="pulse"/>
    <line x1="0" y1="0" x2="-300" y2="-125" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="300" y2="-125" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="-300" y2="75" stroke="#22C55E" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="300" y2="75" stroke="#F59E0B" stroke-width="1" opacity="0.3"/>
    <circle cx="-300" cy="-125" r="2" fill="#00D4FF"/>
    <circle cx="300" cy="-125" r="2" fill="#7C3AED"/>
    <circle cx="-300" cy="75" r="2" fill="#22C55E"/>
    <circle cx="300" cy="75" r="2" fill="#F59E0B"/>
  </g>

  <!-- Status -->
  <g transform="translate(700, 350)">
    <circle cx="0" cy="0" r="5" fill="#22C55E" class="pulse"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#22C55E">5 DEPLOYED</text>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="360" width="800" height="20" fill="url(#accentGradient)"/>
</svg>