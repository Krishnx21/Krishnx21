<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes wave {
        0%, 100% { height: 10; }
        50% { height: 30; }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      .wave { animation: wave 2s ease-in-out infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
    
    <linearGradient id="telemetryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="320" fill="url(#telemetryGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="320" fill="url(#grid)" opacity="0.3"/>

  <!-- Header Zone -->
  <rect x="0" y="0" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="32" class="mono" font-size="14" font-weight="700" fill="#00D4FF">ENGINEERING TELEMETRY</text>
  <text x="750" y="32" text-anchor="end" class="mono" font-size="11" fill="#64748B">FOCUS_ANALYSIS</text>

  <!-- Telemetry Zone -->
  <g transform="translate(25, 70)">
    <!-- Backend -->
    <g transform="translate(0, 0)">
      <rect width="365" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#E6EDF3">BACKEND</text>
      <rect x="310" y="12" width="40" height="16" fill="#22C55E" rx="2" class="wave"/>
      <circle cx="340" cy="20" r="4" fill="#22C55E" class="pulse"/>
    </g>

    <!-- DSA -->
    <g transform="translate(375, 0)">
      <rect width="365" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#E6EDF3">DSA</text>
      <rect x="310" y="15" width="40" height="10" fill="#7C3AED" rx="2" class="wave" style="animation-delay: 0.3s;"/>
      <circle cx="340" cy="20" r="4" fill="#7C3AED" class="pulse"/>
    </g>

    <!-- Cloud -->
    <g transform="translate(0, 55)">
      <rect width="365" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#E6EDF3">CLOUD</text>
      <rect x="310" y="18" width="40" height="4" fill="#00D4FF" rx="2" class="wave" style="animation-delay: 0.6s;"/>
      <circle cx="340" cy="20" r="4" fill="#00D4FF" class="pulse"/>
    </g>

    <!-- DevOps -->
    <g transform="translate(375, 55)">
      <rect width="365" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#E6EDF3">DEVOPS</text>
      <rect x="310" y="19" width="40" height="2" fill="#64748B" rx="2" class="wave" style="animation-delay: 0.9s;"/>
      <circle cx="340" cy="20" r="4" fill="#64748B" class="pulse"/>
    </g>

    <!-- System Design -->
    <g transform="translate(0, 110)">
      <rect width="365" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#E6EDF3">SYSTEM DESIGN</text>
      <rect x="310" y="18" width="40" height="4" fill="#00D4FF" rx="2" class="wave" style="animation-delay: 1.2s;"/>
      <circle cx="340" cy="20" r="4" fill="#00D4FF" class="pulse"/>
    </g>

    <!-- Open Source -->
    <g transform="translate(375, 110)">
      <rect width="365" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#E6EDF3">OPEN SOURCE</text>
      <rect x="310" y="12" width="40" height="16" fill="#22C55E" rx="2" class="wave" style="animation-delay: 1.5s;"/>
      <circle cx="340" cy="20" r="4" fill="#22C55E" class="pulse"/>
    </g>

    <!-- AI/ML -->
    <g transform="translate(0, 165)">
      <rect width="365" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#E6EDF3">AI / ML</text>
      <rect x="310" y="19" width="40" height="2" fill="#64748B" rx="2" class="wave" style="animation-delay: 1.8s;"/>
      <circle cx="340" cy="20" r="4" fill="#64748B" class="pulse"/>
    </g>

    <!-- CertiVault -->
    <g transform="translate(375, 165)">
      <rect width="365" height="40" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#22C55E">CERTIVAULT</text>
      <rect x="310" y="12" width="40" height="16" fill="#22C55E" rx="2" class="wave" style="animation-delay: 2.1s;"/>
      <circle cx="340" cy="20" r="4" fill="#22C55E" class="pulse"/>
    </g>
  </g>

  <!-- Status Zone -->
  <rect x="0" y="270" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="300" class="mono" font-size="11" fill="#64748B">TELEMETRY STATUS: <tspan fill="#22C55E">ACTIVE</tspan></text>
  <text x="750" y="300" text-anchor="end" class="mono" font-size="11" fill="#64748B">REAL-TIME</text>

  <!-- Bottom Border -->
  <rect x="0" y="315" width="800" height="5" fill="url(#accentGradient)"/>
</svg>