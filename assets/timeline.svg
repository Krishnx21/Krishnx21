<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes scan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      .scan { animation: scan 3s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
    
    <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="url(#timelineGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="320" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="45" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="28" class="mono" font-size="14" font-weight="700" fill="#00D4FF">ENGINEERING_TIMELINE</text>
  <text x="750" y="28" text-anchor="end" class="mono" font-size="11" fill="#64748B">JOURNEY</text>

  <!-- Timeline -->
  <g transform="translate(25, 70)">
    <!-- 2024 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#64748B">2024</text>
      <text x="60" y="25" class="mono" font-size="11" fill="#E6EDF3">FOUNDATIONS</text>
      <circle cx="165" cy="20" r="4" fill="#64748B"/>
    </g>

    <!-- 2025 -->
    <g transform="translate(200, 0)">
      <rect width="180" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#64748B">2025</text>
      <text x="60" y="25" class="mono" font-size="11" fill="#E6EDF3">WEB / FULL STACK</text>
      <circle cx="165" cy="20" r="4" fill="#64748B"/>
    </g>

    <g transform="translate(400, 0)">
      <rect width="180" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#64748B">2025</text>
      <text x="60" y="25" class="mono" font-size="11" fill="#E6EDF3">OPEN SOURCE</text>
      <circle cx="165" cy="20" r="4" fill="#64748B"/>
    </g>

    <g transform="translate(600, 0)">
      <rect width="180" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#64748B">2025</text>
      <text x="60" y="25" class="mono" font-size="11" fill="#E6EDF3">PROJECTS</text>
      <circle cx="165" cy="20" r="4" fill="#64748B"/>
    </g>

    <!-- 2026 -->
    <g transform="translate(0, 60)">
      <rect width="180" height="40" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#00D4FF">2026</text>
      <text x="60" y="25" class="mono" font-size="11" fill="#E6EDF3">BACKEND</text>
      <circle cx="165" cy="20" r="4" fill="#00D4FF" class="pulse"/>
    </g>

    <g transform="translate(200, 60)">
      <rect width="180" height="40" fill="#0B0F17" stroke="#7C3AED" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#7C3AED">2026</text>
      <text x="60" y="25" class="mono" font-size="11" fill="#E6EDF3">CLOUD</text>
      <circle cx="165" cy="20" r="4" fill="#7C3AED" class="pulse" style="animation-delay: 0.3s;"/>
    </g>

    <g transform="translate(400, 60)">
      <rect width="180" height="40" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#22C55E">2026</text>
      <text x="60" y="25" class="mono" font-size="11" fill="#E6EDF3">DEVOPS</text>
      <circle cx="165" cy="20" r="4" fill="#22C55E" class="pulse" style="animation-delay: 0.6s;"/>
    </g>

    <g transform="translate(600, 60)">
      <rect width="180" height="40" fill="#0B0F17" stroke="#F59E0B" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="12" fill="#F59E0B">2026</text>
      <text x="60" y="25" class="mono" font-size="11" fill="#E6EDF3">DSA</text>
      <circle cx="165" cy="20" r="4" fill="#F59E0B" class="pulse" style="animation-delay: 0.9s;"/>
    </g>

    <!-- Current Focus -->
    <g transform="translate(0, 120)">
      <rect width="370" height="40" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="11" fill="#00D4FF">CURRENT: CERTIVAULT</text>
      <circle cx="340" cy="20" r="4" fill="#00D4FF" class="pulse"/>
    </g>

    <g transform="translate(390, 120)">
      <rect width="370" height="40" fill="#0B0F17" stroke="#7C3AED" stroke-width="1" rx="4"/>
      <text x="15" y="25" class="mono" font-size="11" fill="#7C3AED">CURRENT: OPSPILOT</text>
      <circle cx="340" cy="20" r="4" fill="#7C3AED" class="pulse" style="animation-delay: 0.5s;"/>
    </g>

    <!-- Scan line -->
    <rect x="0" y="180" width="750" height="2" fill="url(#accentGradient)" class="scan" opacity="0.3"/>
  </g>

  <!-- Status -->
  <g transform="translate(700, 295)">
    <circle cx="0" cy="0" r="4" fill="#00D4FF" class="pulse"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#00D4FF">JOURNEY_ACTIVE</text>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="310" width="800" height="10" fill="url(#accentGradient)"/>
</svg>