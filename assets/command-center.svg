<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 240" width="736" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="736" height="240" fill="url(#bgGradient)" rx="8"/>
  
  <!-- Subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="736" height="240" fill="url(#grid)" opacity="0.3"/>

  <!-- Terminal Header -->
  <rect x="0" y="0" width="736" height="35" fill="#161b22" rx="8"/>
  <rect x="0" y="27" width="736" height="8" fill="#161b22"/>
  
  <!-- Terminal dots -->
  <circle cx="20" cy="17" r="4" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="4" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="4" fill="#27ca40"/>
  
  <text x="80" y="22" class="mono" font-size="12" fill="#8b949e">ksh-terminal — bash — 80x24</text>

  <!-- Terminal Content -->
  <g transform="translate(20, 55)">
    <!-- whoami -->
    <text x="0" y="15" class="mono" font-size="12" fill="#00d4ff">$ whoami</text>
    <text x="100" y="15" class="mono" font-size="12" fill="#ffffff">Krishna Kumar Sharma</text>

    <!-- focus -->
    <text x="0" y="40" class="mono" font-size="12" fill="#00d4ff">$ focus</text>
    <text x="100" y="40" class="mono" font-size="12" fill="#ffffff">Backend + Cloud + DSA</text>

    <!-- build -->
    <text x="0" y="65" class="mono" font-size="12" fill="#00d4ff">$ build</text>
    <text x="100" y="65" class="mono" font-size="12" fill="#e3b341">CertiVault [ACTIVE]</text>

    <!-- learn -->
    <text x="0" y="90" class="mono" font-size="12" fill="#00d4ff">$ learn</text>
    <text x="100" y="90" class="mono" font-size="12" fill="#a371f7">System Design + DSA</text>

    <!-- contribute -->
    <text x="0" y="115" class="mono" font-size="12" fill="#00d4ff">$ contribute</text>
    <text x="100" y="115" class="mono" font-size="12" fill="#27ca40">Open Source [ACTIVE]</text>

    <!-- status -->
    <text x="0" y="140" class="mono" font-size="12" fill="#00d4ff">$ status</text>
    <text x="100" y="140" class="mono" font-size="12" fill="#27ca40">ONLINE</text>

    <!-- mode -->
    <text x="0" y="165" class="mono" font-size="12" fill="#00d4ff">$ mode</text>
    <text x="100" y="165" class="mono" font-size="12" fill="#ffffff">LEARN // BUILD // SHIP</text>

    <!-- Current command -->
    <text x="0" y="190" class="mono" font-size="12" fill="#00d4ff">$ <tspan class="cursor">_</tspan></text>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="238" width="736" height="2" fill="#00d4ff"/>
</svg>