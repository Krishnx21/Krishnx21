<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 320" width="736" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .flow { animation: flow 2s ease-in-out infinite; }
      @keyframes flow {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 1; }
      }
    </style>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="736" height="320" fill="url(#bgGradient)" rx="8"/>
  
  <!-- Subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="736" height="320" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="736" height="40" fill="#161b22" rx="8"/>
  <rect x="0" y="32" width="736" height="8" fill="#161b22"/>
  <text x="20" y="26" class="mono" font-size="14" font-weight="700" fill="#00d4ff">// BUILD_LOG</text>
  <line x1="0" y1="40" x2="736" y2="40" stroke="#1a2332" stroke-width="1"/>

  <!-- Build Pipeline -->
  <g transform="translate(40, 70)">
    <!-- Pipeline nodes -->
    <rect x="0" y="0" width="80" height="35" fill="#0d1117" stroke="#27ca40" stroke-width="2" rx="4"/>
    <text x="40" y="22" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#27ca40">IDEA</text>
    
    <line x1="80" y1="17" x2="110" y2="17" stroke="#00d4ff" stroke-width="2" class="flow"/>
    
    <rect x="110" y="0" width="80" height="35" fill="#0d1117" stroke="#00d4ff" stroke-width="2" rx="4"/>
    <text x="150" y="22" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#00d4ff">DESIGN</text>
    
    <line x1="190" y1="17" x2="220" y2="17" stroke="#00d4ff" stroke-width="2" class="flow"/>
    
    <rect x="220" y="0" width="80" height="35" fill="#0d1117" stroke="#00d4ff" stroke-width="2" rx="4"/>
    <text x="260" y="22" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#00d4ff">CODE</text>
    
    <line x1="300" y1="17" x2="330" y2="17" stroke="#00d4ff" stroke-width="2" class="flow"/>
    
    <rect x="330" y="0" width="80" height="35" fill="#0d1117" stroke="#e3b341" stroke-width="2" rx="4"/>
    <text x="370" y="22" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#e3b341">TEST</text>
    
    <line x1="410" y1="17" x2="440" y2="17" stroke="#ff5f56" stroke-width="2" class="flow"/>
    
    <rect x="440" y="0" width="80" height="35" fill="#0d1117" stroke="#ff5f56" stroke-width="2" rx="4"/>
    <text x="480" y="22" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#ff5f56">CI/CD</text>
    
    <line x1="520" y1="17" x2="550" y2="17" stroke="#27ca40" stroke-width="2" class="flow"/>
    
    <rect x="550" y="0" width="80" height="35" fill="#0d1117" stroke="#27ca40" stroke-width="2" rx="4"/>
    <text x="590" y="22" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#27ca40">DEPLOY</text>
    
    <line x1="630" y1="17" x2="660" y2="17" stroke="#8b949e" stroke-width="2" class="flow"/>
    
    <rect x="660" y="0" width="80" height="35" fill="#0d1117" stroke="#8b949e" stroke-width="2" rx="4"/>
    <text x="700" y="22" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#8b949e">MONITOR</text>
  </g>

  <!-- Current Build Section -->
  <g transform="translate(20, 130)">
    <rect width="680" height="60" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#e3b341">CURRENT BUILD</text>
    <line x1="15" y1="35" x2="665" y2="35" stroke="#1a2332" stroke-width="0.5"/>
    
    <text x="15" y="50" class="mono" font-size="12" fill="#ffffff">CertiVault</text>
    <rect x="120" y="42" width="200" height="12" fill="#161b22" rx="2"/>
    <rect x="120" y="42" width="160" height="12" fill="#e3b341" rx="2"/>
    <text x="330" y="52" class="mono" font-size="10" fill="#e3b341">ACTIVE DEVELOPMENT</text>
  </g>

  <!-- Timeline Section -->
  <g transform="translate(20, 210)">
    <rect width="680" height="90" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#00d4ff">2026 TIMELINE</text>
    <line x1="15" y1="35" x2="665" y2="35" stroke="#1a2332" stroke-width="0.5"/>
    
    <text x="15" y="55" class="mono" font-size="10" fill="#27ca40">[BUILD] CertiVault</text>
    <text x="150" y="55" class="mono" font-size="10" fill="#a371f7">[LEARN] System Design</text>
    <text x="300" y="55" class="mono" font-size="10" fill="#00d4ff">[SHIP] Backend APIs</text>
    <text x="450" y="55" class="mono" font-size="10" fill="#27ca40">[CONTRIBUTE] Open Source</text>
    
    <text x="15" y="75" class="mono" font-size="10" fill="#e3b341">[TRAIN] DSA</text>
    <text x="150" y="75" class="mono" font-size="10" fill="#00d4ff">[EXPLORE] Cloud / DevOps</text>
    <text x="300" y="75" class="mono" font-size="10" fill="#8b949e">[FOCUS] Backend Engineering</text>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="318" width="736" height="2" fill="#00d4ff"/>
</svg>