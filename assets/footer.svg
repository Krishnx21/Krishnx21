    </pattern>

    <style>
      .mono { font-family: ui-monospace, 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="180" rx="12" fill="url(#bgGrad)" stroke="#1e2d4a" stroke-width="1.5" />
  <rect width="900" height="180" rx="12" fill="url(#grid)" />

  <path d="M 25 20 L 875 20" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.8"/>

