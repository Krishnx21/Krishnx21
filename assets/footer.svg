<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes signal {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      
      @keyframes data-bit {
        0% { transform: translateX(0); opacity: 1; }
        100% { transform: translateX(10px); opacity: 0; }
      }
      
      .signal { animation: signal 2s ease-in-out infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .data-bit { animation: data-bit 1s linear infinite; }
    </style>
    
    <linearGradient id="footerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" fill="url(#footerGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="120" fill="url(#grid)" opacity="0.3"/>

  <!-- Main Signature Zone -->
  <text x="400" y="40" text-anchor="middle" class="mono" font-size="16" font-weight="800" fill="#00D4FF">KSH // ENGINEERING OS</text>
  
  <!-- Philosophy Zone -->
  <text x="400" y="65" text-anchor="middle" class="mono" font-size="14" fill="#7C3AED">BUILD • DEBUG • LEARN • SHIP</text>
  
  <!-- Digital Signal Zone -->
  <g transform="translate(400, 90)">
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#22C55E" class="pulse"/>
    <circle cx="-50" cy="0" r="2" fill="#00D4FF" class="signal"/>
    <circle cx="50" cy="0" r="2" fill="#7C3AED" class="signal" style="animation-delay: 0.5s;"/>
    
    <!-- Data bits -->
    <circle cx="-80" cy="0" r="1" fill="#22C55E" class="data-bit"/>
    <circle cx="-70" cy="0" r="1" fill="#00D4FF" class="data-bit" style="animation-delay: 0.2s;"/>
    <circle cx="70" cy="0" r="1" fill="#7C3AED" class="data-bit" style="animation-delay: 0.3s;"/>
    <circle cx="80" cy="0" r="1" fill="#F59E0B" class="data-bit" style="animation-delay: 0.4s;"/>
  </g>

  <!-- Status Zone -->
  <g transform="translate(700, 105)">
    <circle cx="0" cy="0" r="4" fill="#22C55E" class="pulse"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#22C55E">always building.</text>
  </g>

  <!-- Top Border -->
  <rect x="0" y="0" width="800" height="2" fill="url(#accentGradient)"/>
  
  <!-- Bottom Border -->
  <rect x="0" y="118" width="800" height="2" fill="url(#accentGradient)"/>
</svg>