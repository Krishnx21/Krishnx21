<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes radar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes signal {
        0%, 100% { r: 3; opacity: 1; }
        50% { r: 5; opacity: 0.5; }
      }
      
      .rotate { animation: rotate 20s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .radar { animation: radar 4s linear infinite; transform-origin: 450px 200px; }
      .signal { animation: signal 2s ease-in-out infinite; }
    </style>
    
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="900" height="500" fill="url(#heroGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="500" fill="url(#grid)" opacity="0.3"/>

  <!-- Name Zone -->
  <g transform="translate(450, 160)">
    <text x="0" y="0" text-anchor="middle" class="mono" font-size="48" font-weight="800" fill="#E6EDF3">KRISHNA</text>
    <text x="0" y="50" text-anchor="middle" class="mono" font-size="48" font-weight="800" fill="#E6EDF3">KUMAR</text>
    <text x="0" y="100" text-anchor="middle" class="mono" font-size="48" font-weight="800" fill="#E6EDF3">SHARMA</text>
  </g>

  <!-- Subtitle Zone -->
  <g transform="translate(450, 290)">
    <text x="0" y="0" text-anchor="middle" class="mono" font-size="14" fill="#00D4FF">BACKEND • CLOUD • DEVOPS • OPEN SOURCE</text>
  </g>

  <!-- Role Zone -->
  <g transform="translate(450, 320)">
    <text x="0" y="0" text-anchor="middle" class="mono" font-size="12" fill="#8B949E">COMPUTER SCIENCE ENGINEER</text>
  </g>

  <!-- HUD Elements -->
  <g transform="translate(450, 200)">
    <!-- Radar Circles -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.1" class="rotate"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.1" class="rotate" style="animation-direction: reverse;"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.2"/>
    
    <!-- Radar Sweep -->
    <line x1="0" y1="0" x2="0" y2="-150" stroke="url(#accentGradient)" stroke-width="2" class="radar" opacity="0.3"/>
    
    <!-- Network Nodes -->
    <circle cx="-120" cy="-80" r="4" fill="#00D4FF" class="signal"/>
    <circle cx="120" cy="-80" r="4" fill="#7C3AED" class="signal" style="animation-delay: 0.5s;"/>
    <circle cx="-120" cy="80" r="4" fill="#22C55E" class="signal" style="animation-delay: 1s;"/>
    <circle cx="120" cy="80" r="4" fill="#F59E0B" class="signal" style="animation-delay: 1.5s;"/>
    
    <!-- Connection Lines -->
    <line x1="-120" y1="-80" x2="0" y2="0" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
    <line x1="120" y1="-80" x2="0" y2="0" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
    <line x1="-120" y1="80" x2="0" y2="0" stroke="#22C55E" stroke-width="1" opacity="0.3"/>
    <line x1="120" y1="80" x2="0" y2="0" stroke="#F59E0B" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Status Panel Zone -->
  <g transform="translate(50, 380)">
    <rect width="800" height="80" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    
    <text x="20" y="25" class="mono" font-size="11" fill="#64748B">SYSTEM STATUS</text>
    <circle cx="140" cy="20" r="5" fill="#22C55E" class="pulse"/>
    <text x="155" y="24" class="mono" font-size="11" fill="#22C55E">ONLINE</text>
    
    <text x="20" y="50" class="mono" font-size="11" fill="#64748B">CURRENT MODE</text>
    <text x="140" y="50" class="mono" font-size="11" fill="#00D4FF">BUILD / LEARN / SHIP</text>
    
    <text x="400" y="25" class="mono" font-size="11" fill="#64748B">SIGNAL</text>
    <text x="460" y="25" class="mono" font-size="11" fill="#22C55E">CONNECTED</text>
    
    <text x="400" y="50" class="mono" font-size="11" fill="#64748B">KSH-OS</text>
    <text x="460" y="50" class="mono" font-size="11" fill="#7C3AED">v2.0</text>
  </g>

  <!-- Corner Accents -->
  <path d="M 0 0 L 50 0 L 0 50 Z" fill="url(#accentGradient)" opacity="0.1"/>
  <path d="M 900 500 L 850 500 L 900 450 Z" fill="url(#accentGradient)" opacity="0.1"/>
</svg>