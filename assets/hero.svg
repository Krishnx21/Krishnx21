<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes radar-sweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes signal {
        0%, 100% { r: 3; opacity: 1; }
        50% { r: 5; opacity: 0.5; }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      
      .rotate { animation: rotate 20s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .cursor { animation: blink 1s step-end infinite; }
      .radar-sweep { animation: radar-sweep 4s linear infinite; transform-origin: 450px 250px; }
      .signal { animation: signal 2s ease-in-out infinite; }
      .float { animation: float 3s ease-in-out infinite; }
    </style>
    
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#heroGradient)"/>
  
  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="500" fill="url(#grid)" opacity="0.3"/>

  <!-- Radar Circles -->
  <circle cx="450" cy="250" r="200" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.1" class="rotate"/>
  <circle cx="450" cy="250" r="150" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.1" class="rotate" style="animation-direction: reverse;"/>
  <circle cx="450" cy="250" r="100" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.2"/>

  <!-- Radar Sweep -->
  <line x1="450" y1="250" x2="450" y2="50" stroke="url(#accentGradient)" stroke-width="2" class="radar-sweep" opacity="0.3"/>

  <!-- Network Nodes -->
  <circle cx="200" cy="150" r="4" fill="#00D4FF" class="signal"/>
  <circle cx="700" cy="150" r="4" fill="#7C3AED" class="signal" style="animation-delay: 0.5s;"/>
  <circle cx="200" cy="350" r="4" fill="#22C55E" class="signal" style="animation-delay: 1s;"/>
  <circle cx="700" cy="350" r="4" fill="#F59E0B" class="signal" style="animation-delay: 1.5s;"/>

  <!-- Connection Lines -->
  <line x1="200" y1="150" x2="450" y2="250" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
  <line x1="700" y1="150" x2="450" y2="250" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="350" x2="450" y2="250" stroke="#22C55E" stroke-width="1" opacity="0.3"/>
  <line x1="700" y1="350" x2="450" y2="250" stroke="#F59E0B" stroke-width="1" opacity="0.3"/>

  <!-- Main Identity -->
  <g transform="translate(450, 250)" class="float">
    <text x="0" y="-20" text-anchor="middle" class="mono" font-size="36" font-weight="800" fill="#E6EDF3" filter="url(#glow)">KRISHNA KUMAR SHARMA</text>
    
    <!-- Focus Areas -->
    <text x="0" y="20" text-anchor="middle" class="mono" font-size="14" fill="#00D4FF">BACKEND</text>
    <text x="0" y="40" text-anchor="middle" class="mono" font-size="14" fill="#7C3AED">CLOUD</text>
    <text x="0" y="60" text-anchor="middle" class="mono" font-size="14" fill="#22C55E">DEVOPS</text>
    <text x="0" y="80" text-anchor="middle" class="mono" font-size="14" fill="#F59E0B">OPEN SOURCE</text>
    <text x="0" y="100" text-anchor="middle" class="mono" font-size="14" fill="#E6EDF3">DSA</text>
  </g>

  <!-- Terminal Block -->
  <g transform="translate(150, 380)">
    <rect width="600" height="80" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    <text x="20" y="25" class="mono" font-size="11" fill="#00D4FF">KSH // ENGINEERING TERMINAL</text>
    <text x="20" y="45" class="mono" font-size="10" fill="#64748B">STATUS: <tspan fill="#22C55E">BUILDING</tspan></text>
    <text x="20" y="65" class="mono" font-size="10" fill="#64748B">MODE: <tspan fill="#00D4FF">LEARN → BUILD → SHIP</tspan></text>
    
    <circle cx="560" cy="40" r="5" fill="#22C55E" class="pulse"/>
    <text x="520" y="44" class="mono" font-size="10" fill="#22C55E">ONLINE</text>
  </g>

  <!-- HUD Elements -->
  <g transform="translate(50, 50)">
    <rect width="120" height="30" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="2"/>
    <text x="10" y="20" class="mono" font-size="10" fill="#64748B">SYS: KSH-OS v1.0</text>
  </g>

  <g transform="translate(730, 50)">
    <rect width="120" height="30" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="2"/>
    <text x="10" y="20" class="mono" font-size="10" fill="#00D4FF">TIME: <tspan fill="#E6EDF3">LIVE</tspan></text>
  </g>

  <!-- Corner Accents -->
  <path d="M 0 0 L 50 0 L 0 50 Z" fill="url(#accentGradient)" opacity="0.1"/>
  <path d="M 900 500 L 850 500 L 900 450 Z" fill="url(#accentGradient)" opacity="0.1"/>
</svg>