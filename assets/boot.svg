<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      /* No @import: GitHub renders README images via <img>, which blocks external
         font fetches. A local monospace stack is used so glyphs never fall back
         to a proportional font and break alignment. */
      .mono { font-family: 'JetBrains Mono','Cascadia Code','SF Mono','DejaVu Sans Mono',
              'Liberation Mono',Consolas,Menlo,monospace; }

      @keyframes cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes scan {
        0% { transform: translateY(-100%); opacity: 0; }
        50% { opacity: 0.3; }
        100% { transform: translateY(100%); opacity: 0; }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes load {
        from { width: 0; }
        to { width: 100%; }
      }
      
      .cursor { animation: cursor 1s step-end infinite; }
      .scan { animation: scan 3s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .load { animation: load 2s ease-out forwards; }
    </style>
    
    <linearGradient id="bootGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="400" fill="url(#bootGradient)"/>
  
  <!-- Scan Line -->
  <rect x="0" y="0" width="800" height="400" fill="url(#accentGradient)" opacity="0.05" class="scan"/>

  <!-- Header Zone -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" class="mono" font-size="16" font-weight="800" fill="#00D4FF" letter-spacing="4">KSH // ENGINEERING OS</text>
    <text x="0" y="25" class="mono" font-size="12" fill="#64748B">VERSION 2.0</text>
    <line x1="0" y1="40" x2="700" y2="40" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Loading Zone -->
  <g transform="translate(50, 100)">
    <text x="0" y="0" class="mono" font-size="14" fill="#8B949E">INITIALIZING...</text>
    
    <!-- Progress Bar (SMIL, not CSS: percentage widths on SVG rects resolve against
         the viewport, not the parent, so CSS width:100% overshot the 700px track) -->
    <rect x="0" y="15" width="700" height="4" fill="#0B0F17" rx="2"/>
    <rect x="0" y="15" width="0" height="4" fill="url(#accentGradient)" rx="2">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
               values="0;700;700;0" keyTimes="0;0.42;0.94;1" calcMode="linear"/>
    </rect>
  </g>

  <!-- Boot Items Zone — now check in sequentially instead of all at once -->
  <g transform="translate(50, 150)">
    <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.07;0.09;0.94;0.98"/>
      <text x="0" y="0" class="mono" font-size="12" fill="#22C55E">[✓] IDENTITY MODULE</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.13;0.15;0.94;0.98"/>
      <text x="0" y="25" class="mono" font-size="12" fill="#22C55E">[✓] ENGINEERING PROFILE</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.19;0.21;0.94;0.98"/>
      <text x="0" y="50" class="mono" font-size="12" fill="#22C55E">[✓] PROJECT DATABASE</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.25;0.27;0.94;0.98"/>
      <text x="0" y="75" class="mono" font-size="12" fill="#22C55E">[✓] TECHNOLOGY MATRIX</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.31;0.33;0.94;0.98"/>
      <text x="0" y="100" class="mono" font-size="12" fill="#22C55E">[✓] OPEN SOURCE NETWORK</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.37;0.39;0.94;0.98"/>
      <text x="0" y="125" class="mono" font-size="12" fill="#22C55E">[✓] GITHUB TELEMETRY</text></g>
  </g>

  <!-- System Ready Zone -->
  <g transform="translate(50, 310)">
    <text x="0" y="0" class="mono" font-size="14" font-weight="700" fill="#00D4FF">SYSTEM READY</text>
    <text x="0" y="30" class="mono" font-size="12" fill="#E6EDF3">&gt; welcome, Krishna Kumar Sharma<tspan class="cursor" fill="#00D4FF">_</tspan></text>
  </g>

  <!-- Status Zone -->
  <g transform="translate(600, 355)">
    <circle cx="0" cy="0" r="6" fill="#22C55E" class="pulse"/>
    <text x="15" y="4" class="mono" font-size="11" fill="#22C55E">ONLINE</text>
  </g>

  <!-- Footer Zone -->
  <g transform="translate(50, 385)">
    <text x="0" y="0" class="mono" font-size="10" fill="#64748B">KSH-OS v2.0 // ENGINEERING TERMINAL</text>
  </g>
</svg>