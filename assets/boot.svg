<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes scan {
        0% { transform: translateY(-100%); opacity: 0; }
        50% { opacity: 0.3; }
        100% { transform: translateY(100%); opacity: 0; }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes boot-line {
        from { width: 0; }
        to { width: 100%; }
      }
      
      .cursor { animation: blink 1s step-end infinite; }
      .scan-line { animation: scan 3s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
    
    <linearGradient id="bootGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bootGradient)"/>
  
  <!-- Scan line effect -->
  <rect x="0" y="0" width="800" height="400" fill="url(#accentGradient)" opacity="0.05" class="scan-line"/>

  <!-- Boot Header -->
  <text x="400" y="50" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#00D4FF" letter-spacing="4">KSH ENGINEERING OS</text>
  <line x1="200" y1="65" x2="600" y2="65" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>

  <!-- Boot Sequence -->
  <g transform="translate(100, 100)">
    <text x="0" y="0" class="mono" font-size="12" fill="#22C55E">[ OK ]</text>
    <text x="80" y="0" class="mono" font-size="12" fill="#E6EDF3">loading identity</text>
    
    <text x="0" y="30" class="mono" font-size="12" fill="#22C55E">[ OK ]</text>
    <text x="80" y="30" class="mono" font-size="12" fill="#E6EDF3">loading engineering profile</text>
    
    <text x="0" y="60" class="mono" font-size="12" fill="#22C55E">[ OK ]</text>
    <text x="80" y="60" class="mono" font-size="12" fill="#E6EDF3">loading projects</text>
    
    <text x="0" y="90" class="mono" font-size="12" fill="#22C55E">[ OK ]</text>
    <text x="80" y="90" class="mono" font-size="12" fill="#E6EDF3">loading technical stack</text>
    
    <text x="0" y="120" class="mono" font-size="12" fill="#22C55E">[ OK ]</text>
    <text x="80" y="120" class="mono" font-size="12" fill="#E6EDF3">loading contribution stream</text>
    
    <text x="0" y="150" class="mono" font-size="12" fill="#22C55E">[ OK ]</text>
    <text x="80" y="150" class="mono" font-size="12" fill="#E6EDF3">loading current objectives</text>
  </g>

  <!-- System Ready -->
  <g transform="translate(100, 300)">
    <text x="0" y="0" class="mono" font-size="13" font-weight="700" fill="#00D4FF">SYSTEM READY</text>
    <text x="0" y="30" class="mono" font-size="12" fill="#64748B">&gt; welcome, Krishna Kumar Sharma<span class="cursor">_</span></text>
  </g>

  <!-- Status indicators -->
  <g transform="translate(650, 350)">
    <circle cx="0" cy="0" r="4" fill="#22C55E" class="pulse"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#22C55E">ONLINE</text>
  </g>

  <!-- Terminal timestamp -->
  <text x="750" y="380" text-anchor="end" class="mono" font-size="10" fill="#64748B">KSH-OS v1.0</text>
</svg>