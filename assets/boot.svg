<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes scan {
        0% { transform: translateY(-100%); opacity: 0; }
        50% { opacity: 0.3; }
        100% { transform: translateY(100%); opacity: 0; }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes load {
        from { width: 0; }
        to { width: 100%; }
      }
      
      .cursor { animation: cursor 1s step-end infinite; }
      .scan { animation: scan 3s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .load { animation: load 2s ease-out forwards; }
    </style>
    
    <linearGradient id="bootGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="400" fill="url(#bootGradient)"/>
  
  <!-- Scan Line -->
  <rect x="0" y="0" width="800" height="400" fill="url(#accentGradient)" opacity="0.05" class="scan"/>

  <!-- Header Zone -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" class="mono" font-size="16" font-weight="800" fill="#00D4FF" letter-spacing="4">KSH // ENGINEERING OS</text>
    <text x="0" y="25" class="mono" font-size="12" fill="#64748B">VERSION 2.0</text>
    <line x1="0" y1="40" x2="700" y2="40" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Loading Zone -->
  <g transform="translate(50, 100)">
    <text x="0" y="0" class="mono" font-size="14" fill="#8B949E">INITIALIZING...</text>
    
    <!-- Progress Bar -->
    <rect x="0" y="15" width="700" height="4" fill="#0B0F17" rx="2"/>
    <rect x="0" y="15" width="700" height="4" fill="url(#accentGradient)" rx="2" class="load"/>
  </g>

  <!-- Boot Items Zone -->
  <g transform="translate(50, 150)">
    <text x="0" y="0" class="mono" font-size="12" fill="#22C55E">[✓] IDENTITY MODULE</text>
    <text x="0" y="25" class="mono" font-size="12" fill="#22C55E">[✓] ENGINEERING PROFILE</text>
    <text x="0" y="50" class="mono" font-size="12" fill="#22C55E">[✓] PROJECT DATABASE</text>
    <text x="0" y="75" class="mono" font-size="12" fill="#22C55E">[✓] TECHNOLOGY MATRIX</text>
    <text x="0" y="100" class="mono" font-size="12" fill="#22C55E">[✓] OPEN SOURCE NETWORK</text>
    <text x="0" y="125" class="mono" font-size="12" fill="#22C55E">[✓] GITHUB TELEMETRY</text>
  </g>

  <!-- System Ready Zone -->
  <g transform="translate(50, 310)">
    <text x="0" y="0" class="mono" font-size="14" font-weight="700" fill="#00D4FF">SYSTEM READY</text>
    <text x="0" y="30" class="mono" font-size="12" fill="#E6EDF3">&gt; welcome, Krishna Kumar Sharma<span class="cursor">_</span></text>
  </g>

  <!-- Status Zone -->
  <g transform="translate(600, 355)">
    <circle cx="0" cy="0" r="6" fill="#22C55E" class="pulse"/>
    <text x="15" y="4" class="mono" font-size="11" fill="#22C55E">ONLINE</text>
  </g>

  <!-- Footer Zone -->
  <g transform="translate(50, 385)">
    <text x="0" y="0" class="mono" font-size="10" fill="#64748B">KSH-OS v2.0 // ENGINEERING TERMINAL</text>
  </g>
</svg>