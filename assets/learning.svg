<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes data-flow {
        0% { transform: translateX(0); opacity: 1; }
        100% { transform: translateX(100px); opacity: 0; }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      .data-flow { animation: data-flow 2s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
    
    <linearGradient id="learningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="url(#learningGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="320" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="45" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="28" class="mono" font-size="14" font-weight="700" fill="#00D4FF">LEARNING_ENGINE</text>
  <text x="750" y="28" text-anchor="end" class="mono" font-size="11" fill="#64748B">KNOWLEDGE_PIPELINE</text>

  <!-- Learning Pipeline -->
  <g transform="translate(25, 70)">
    <!-- Nodes -->
    <g transform="translate(0, 0)">
      <rect width="140" height="35" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="70" y="22" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">INPUT</text>
    </g>

    <g transform="translate(160, 0)">
      <rect width="140" height="35" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="70" y="22" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">CONCEPT</text>
    </g>

    <g transform="translate(320, 0)">
      <rect width="140" height="35" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="70" y="22" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">PRACTICE</text>
    </g>

    <g transform="translate(480, 0)">
      <rect width="140" height="35" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="70" y="22" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">PROJECT</text>
    </g>

    <g transform="translate(640, 0)">
      <rect width="140" height="35" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
      <text x="70" y="22" text-anchor="middle" class="mono" font-size="11" fill="#E6EDF3">FEEDBACK</text>
    </g>

    <!-- Arrows -->
    <line x1="140" y1="17" x2="160" y2="17" stroke="#00D4FF" stroke-width="2"/>
    <line x1="300" y1="17" x2="320" y2="17" stroke="#00D4FF" stroke-width="2"/>
    <line x1="460" y1="17" x2="480" y2="17" stroke="#00D4FF" stroke-width="2"/>
    <line x1="620" y1="17" x2="640" y2="17" stroke="#00D4FF" stroke-width="2"/>

    <!-- Data packets -->
    <circle cx="150" cy="17" r="3" fill="#00D4FF" class="data-flow"/>
    <circle cx="310" cy="17" r="3" fill="#7C3AED" class="data-flow" style="animation-delay: 0.5s;"/>
    <circle cx="470" cy="17" r="3" fill="#22C55E" class="data-flow" style="animation-delay: 1s;"/>
    <circle cx="630" cy="17" r="3" fill="#F59E0B" class="data-flow" style="animation-delay: 1.5s;"/>
  </g>

  <!-- Current Learning -->
  <g transform="translate(25, 130)">
    <rect width="750" height="120" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#00D4FF">CURRENTLY_LEARNING</text>
    <line x1="15" y1="35" x2="735" y2="35" stroke="#1E293B" stroke-width="0.5"/>
    
    <text x="15" y="55" class="mono" font-size="10" fill="#E6EDF3">DSA</text>
    <text x="15" y="75" class="mono" font-size="10" fill="#E6EDF3">Backend Architecture</text>
    <text x="15" y="95" class="mono" font-size="10" fill="#E6EDF3">System Design</text>
    <text x="200" y="55" class="mono" font-size="10" fill="#E6EDF3">Cloud</text>
    <text x="200" y="75" class="mono" font-size="10" fill="#E6EDF3">DevOps</text>
    <text x="200" y="95" class="mono" font-size="10" fill="#E6EDF3">AI / ML</text>
    
    <circle cx="700" cy="55" r="3" fill="#7C3AED" class="pulse"/>
    <circle cx="700" cy="75" r="3" fill="#00D4FF" class="pulse" style="animation-delay: 0.3s;"/>
    <circle cx="700" cy="95" r="3" fill="#F59E0B" class="pulse" style="animation-delay: 0.6s;"/>
  </g>

  <!-- Output -->
  <g transform="translate(25, 270)">
    <rect width="750" height="35" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
    <text x="15" y="22" class="mono" font-size="11" fill="#22C55E">OUTPUT: KNOWLEDGE</text>
    
    <circle cx="700" cy="17" r="4" fill="#22C55E" class="pulse"/>
  </g>

  <!-- Status -->
  <g transform="translate(700, 315)">
    <circle cx="0" cy="0" r="4" fill="#22C55E" class="pulse"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#22C55E">ENGINE_ACTIVE</text>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="310" width="800" height="10" fill="url(#accentGradient)"/>
</svg>