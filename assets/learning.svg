<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes data-flow {
        0% { transform: translateX(0); opacity: 1; }
        100% { transform: translateX(15px); opacity: 0; }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      .data-flow { animation: data-flow 2s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
    
    <linearGradient id="learningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="320" fill="url(#learningGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="320" fill="url(#grid)" opacity="0.3"/>

  <!-- Header Zone -->
  <rect x="0" y="0" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="32" class="mono" font-size="14" font-weight="700" fill="#00D4FF">LEARNING ENGINE</text>
  <text x="750" y="32" text-anchor="end" class="mono" font-size="11" fill="#64748B">KNOWLEDGE_PIPELINE</text>

  <!-- Current Learning Zone -->
  <g transform="translate(25, 70)">
    <rect width="750" height="70" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#00D4FF">CURRENT_LEARNING</text>
    
    <text x="15" y="45" class="mono" font-size="10" fill="#E6EDF3">DSA</text>
    <text x="60" y="45" class="mono" font-size="10" fill="#E6EDF3">Backend_Engineering</text>
    <text x="220" y="45" class="mono" font-size="10" fill="#E6EDF3">System_Design</text>
    <text x="350" y="45" class="mono" font-size="10" fill="#E6EDF3">Cloud</text>
    <text x="420" y="45" class="mono" font-size="10" fill="#E6EDF3">DevOps</text>
    <text x="490" y="45" class="mono" font-size="10" fill="#E6EDF3">AI/ML</text>
    
    <circle cx="700" cy="42" r="3" fill="#7C3AED" class="pulse"/>
  </g>

  <!-- Pipeline Zone -->
  <g transform="translate(25, 155)">
    <rect width="750" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    <text x="15" y="20" class="mono" font-size="11" font-weight="700" fill="#7C3AED">LEARNING_PIPELINE</text>
    
    <text x="15" y="38" class="mono" font-size="10" fill="#E6EDF3">LEARN</text>
    <text x="60" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="75" y="38" class="mono" font-size="10" fill="#E6EDF3">PRACTICE</text>
    <text x="140" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="155" y="38" class="mono" font-size="10" fill="#E6EDF3">BUILD</text>
    <text x="200" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="215" y="38" class="mono" font-size="10" fill="#E6EDF3">FAIL</text>
    <text x="250" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="265" y="38" class="mono" font-size="10" fill="#E6EDF3">DEBUG</text>
    <text x="310" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="325" y="38" class="mono" font-size="10" fill="#E6EDF3">UNDERSTAND</text>
    <text x="400" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="415" y="38" class="mono" font-size="10" fill="#E6EDF3">REVISE</text>
    <text x="460" y="38" class="mono" font-size="10" fill="#64748B">→</text>
    <text x="475" y="38" class="mono" font-size="10" fill="#E6EDF3">SHIP</text>
    
    <circle cx="730" cy="35" r="4" fill="#22C55E" class="pulse"/>
  </g>

  <!-- Data Flow Visualization -->
  <g transform="translate(25, 220)">
    <rect width="750" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    <text x="15" y="20" class="mono" font-size="11" fill="#64748B">PROCESS_STATUS</text>
    <text x="15" y="38" class="mono" font-size="10" fill="#22C55E">ACTIVE_PIPELINE</text>
    
    <circle cx="200" cy="35" r="3" fill="#00D4FF" class="data-flow"/>
    <circle cx="250" cy="35" r="3" fill="#7C3AED" class="data-flow" style="animation-delay: 0.3s;"/>
    <circle cx="300" cy="35" r="3" fill="#22C55E" class="data-flow" style="animation-delay: 0.6s;"/>
    <circle cx="350" cy="35" r="3" fill="#F59E0B" class="data-flow" style="animation-delay: 0.9s;"/>
    <circle cx="400" cy="35" r="3" fill="#00D4FF" class="data-flow" style="animation-delay: 1.2s;"/>
  </g>

  <!-- Status Zone -->
  <rect x="0" y="280" width="800" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="305" class="mono" font-size="11" fill="#64748B">ENGINE_STATUS: <tspan fill="#22C55E">OPERATIONAL</tspan></text>
  <text x="750" y="305" text-anchor="end" class="mono" font-size="11" fill="#64748B">PROCESSING</text>

  <!-- Bottom Border -->
  <rect x="0" y="315" width="800" height="5" fill="url(#accentGradient)"/>
</svg>