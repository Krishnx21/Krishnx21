<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes radar-sweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      
      .radar-sweep { animation: radar-sweep 4s linear infinite; transform-origin: 680px 175px; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .blink { animation: blink 1.5s ease-in-out infinite; }
    </style>
    
    <linearGradient id="missionsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="350" fill="url(#missionsGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="350" fill="url(#grid)" opacity="0.3"/>

  <!-- Header Zone -->
  <rect x="0" y="0" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="32" class="mono" font-size="14" font-weight="700" fill="#00D4FF">MISSION CONTROL</text>
  <text x="750" y="32" text-anchor="end" class="mono" font-size="11" fill="#64748B">CURRENT_OBJECTIVES</text>

  <!-- Mission Items Zone -->
  <g transform="translate(25, 70)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#22C55E">01</text>
      <text x="35" y="18" class="mono" font-size="11" fill="#E6EDF3">CERTIVAULT</text>
      <text x="35" y="35" class="mono" font-size="10" fill="#22C55E">✓ SHIPPED</text>
      <circle cx="340" cy="22" r="4" fill="#22C55E" class="pulse"/>
    </g>

    <g transform="translate(375, 0)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#F59E0B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#F59E0B">02</text>
      <text x="35" y="18" class="mono" font-size="11" fill="#E6EDF3">OPSPILOT</text>
      <text x="35" y="35" class="mono" font-size="10" fill="#F59E0B">◐ IN DEVELOPMENT</text>
      <circle cx="340" cy="22" r="4" fill="#F59E0B" class="blink"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 60)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#00D4FF">03</text>
      <text x="35" y="18" class="mono" font-size="11" fill="#E6EDF3">DSA</text>
      <text x="35" y="35" class="mono" font-size="10" fill="#00D4FF">● ACTIVE TRAINING</text>
      <circle cx="340" cy="22" r="4" fill="#00D4FF" class="pulse"/>
    </g>

    <g transform="translate(375, 60)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#00D4FF">04</text>
      <text x="35" y="18" class="mono" font-size="11" fill="#E6EDF3">BACKEND ENGINEERING</text>
      <text x="35" y="35" class="mono" font-size="10" fill="#00D4FF">● ACTIVE</text>
      <circle cx="340" cy="22" r="4" fill="#00D4FF" class="pulse"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 120)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#F59E0B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#F59E0B">05</text>
      <text x="35" y="18" class="mono" font-size="11" fill="#E6EDF3">CLOUD / DEVOPS</text>
      <text x="35" y="35" class="mono" font-size="10" fill="#F59E0B">◐ LEARNING</text>
      <circle cx="340" cy="22" r="4" fill="#F59E0B" class="blink"/>
    </g>

    <g transform="translate(375, 120)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#F59E0B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#F59E0B">06</text>
      <text x="35" y="18" class="mono" font-size="11" fill="#E6EDF3">SYSTEM DESIGN</text>
      <text x="35" y="35" class="mono" font-size="10" fill="#F59E0B">◐ LEARNING</text>
      <circle cx="340" cy="22" r="4" fill="#F59E0B" class="blink"/>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 180)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#00D4FF">07</text>
      <text x="35" y="18" class="mono" font-size="11" fill="#E6EDF3">OPEN SOURCE</text>
      <text x="35" y="35" class="mono" font-size="10" fill="#00D4FF">● CONTRIBUTING</text>
      <circle cx="340" cy="22" r="4" fill="#00D4FF" class="pulse"/>
    </g>

    <g transform="translate(375, 180)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#22C55E">08</text>
      <text x="35" y="18" class="mono" font-size="11" fill="#E6EDF3">GSSOC</text>
      <text x="35" y="35" class="mono" font-size="10" fill="#22C55E">✓ CONTRIBUTOR</text>
      <circle cx="340" cy="22" r="4" fill="#22C55E" class="pulse"/>
    </g>

    <!-- Row 5 -->
    <g transform="translate(0, 240)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#F59E0B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#F59E0B">09</text>
      <text x="35" y="18" class="mono" font-size="11" fill="#E6EDF3">ECSOC</text>
      <text x="35" y="35" class="mono" font-size="10" fill="#F59E0B">✓ PROJECT ADMIN</text>
      <circle cx="340" cy="22" r="4" fill="#F59E0B" class="pulse"/>
    </g>

    <g transform="translate(375, 240)">
      <rect width="365" height="45" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#22C55E">10</text>
      <text x="35" y="18" class="mono" font-size="11" fill="#E6EDF3">SYSTEM OVERALL</text>
      <text x="35" y="35" class="mono" font-size="10" fill="#22C55E">● OPERATIONAL</text>
      <circle cx="340" cy="22" r="4" fill="#22C55E" class="pulse"/>
    </g>
  </g>

  <!-- Radar Display -->
  <g transform="translate(680, 175)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#22C55E" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="-50" stroke="#00D4FF" stroke-width="2" class="radar-sweep" opacity="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#22C55E" class="pulse"/>
  </g>

  <!-- Status Zone -->
  <rect x="0" y="360" width="800" height="50" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="390" class="mono" font-size="11" fill="#64748B">MISSION STATUS: <tspan fill="#22C55E">2 COMPLETED</tspan> <tspan fill="#F59E0B">2 LEARNING</tspan> <tspan fill="#00D4FF">3 ACTIVE</tspan> <tspan fill="#22C55E">2 CONTRIBUTOR</tspan></text>
  <text x="750" y="390" text-anchor="end" class="mono" font-size="11" fill="#64748B">KSH-OS v2.0</text>

  <!-- Bottom Border -->
  <rect x="0" y="405" width="800" height="5" fill="url(#accentGradient)"/>
</svg>