<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', sans-serif; }
      
      @keyframes progress-fill {
        from { width: 0; }
        to { width: var(--progress); }
      }
      
      @keyframes slide-in {
        from { transform: translateX(-20px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      
      @keyframes pulse-check {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      
      @keyframes float-mission {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      
      .progress-fill { animation: progress-fill 1.5s ease-out forwards; }
      .slide-in { animation: slide-in 0.5s ease-out forwards; }
      .pulse-check { animation: pulse-check 2s ease-in-out infinite; }
      .float-mission { animation: float-mission 4s ease-in-out infinite; }
    </style>
    
    <linearGradient id="missionsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    
    <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="url(#missionsGradient)" rx="12"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="350" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" rx="12"/>
  <rect y="52" width="800" height="8" fill="#161b22"/>
  
  <text x="25" y="38" class="mono" font-size="16" font-weight="800" fill="#00d4ff">// CURRENT_MISSIONS</text>
  <text x="750" y="38" text-anchor="end" class="mono" font-size="12" fill="#8b949e">ACTIVE_TASKS</text>
  
  <line x1="0" y1="60" x2="800" y2="60" stroke="#1a2332" stroke-width="1"/>

  <!-- Mission Cards -->
  <g transform="translate(25, 80)">
    <!-- Mission 1 -->
    <g transform="translate(0, 0)" class="float-mission slide-in" style="animation-delay: 0.1s;">
      <rect width="730" height="50" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <rect x="0" y="0" width="4" height="50" fill="#e3b341" rx="2"/>
      
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#ffffff">MASTER BACKEND ARCHITECTURE</text>
      <text x="20" y="38" class="sans" font-size="10" fill="#8b949e">Scalable systems, microservices, API design</text>
      
      <g transform="translate(550, 15)">
        <rect width="150" height="20" fill="#0d1117" rx="4"/>
        <rect width="120" height="20" fill="url(#progressGradient)" rx="4" class="progress-fill" style="--progress: 120px;"/>
        <text x="75" y="14" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">80%</text>
      </g>
      
      <circle cx="715" cy="25" r="6" fill="#e3b341" class="pulse-check"/>
    </g>

    <!-- Mission 2 -->
    <g transform="translate(0, 65)" class="float-mission slide-in" style="animation-delay: 0.2s;">
      <rect width="730" height="50" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <rect x="0" y="0" width="4" height="50" fill="#7c3aed" rx="2"/>
      
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#ffffff">CLOUD NATIVE DEVELOPMENT</text>
      <text x="20" y="38" class="sans" font-size="10" fill="#8b949e">AWS, Docker, Kubernetes, serverless</text>
      
      <g transform="translate(550, 15)">
        <rect width="150" height="20" fill="#0d1117" rx="4"/>
        <rect width="90" height="20" fill="url(#progressGradient)" rx="4" class="progress-fill" style="--progress: 90px; animation-delay: 0.3s;"/>
        <text x="75" y="14" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">60%</text>
      </g>
      
      <circle cx="715" cy="25" r="6" fill="#7c3aed" class="pulse-check"/>
    </g>

    <!-- Mission 3 -->
    <g transform="translate(0, 130)" class="float-mission slide-in" style="animation-delay: 0.3s;">
      <rect width="730" height="50" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <rect x="0" y="0" width="4" height="50" fill="#27ca40" rx="2"/>
      
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#ffffff">OPEN SOURCE CONTRIBUTION</text>
      <text x="20" y="38" class="sans" font-size="10" fill="#8b949e">Community projects, documentation, bug fixes</text>
      
      <g transform="translate(550, 15)">
        <rect width="150" height="20" fill="#0d1117" rx="4"/>
        <rect width="105" height="20" fill="url(#progressGradient)" rx="4" class="progress-fill" style="--progress: 105px; animation-delay: 0.4s;"/>
        <text x="75" y="14" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">70%</text>
      </g>
      
      <circle cx="715" cy="25" r="6" fill="#27ca40" class="pulse-check"/>
    </g>

    <!-- Mission 4 -->
    <g transform="translate(0, 195)" class="float-mission slide-in" style="animation-delay: 0.4s;">
      <rect width="730" height="50" fill="url(#cardGradient)" stroke="#1a2332" stroke-width="1" rx="8"/>
      <rect x="0" y="0" width="4" height="50" fill="#a371f7" rx="2"/>
      
      <text x="20" y="20" class="mono" font-size="12" font-weight="700" fill="#ffffff">DSA &amp; ALGORITHMS MASTERY</text>
      <text x="20" y="38" class="sans" font-size="10" fill="#8b949e">Data structures, problem-solving, optimization</text>
      
      <g transform="translate(550, 15)">
        <rect width="150" height="20" fill="#0d1117" rx="4"/>
        <rect width="75" height="20" fill="url(#progressGradient)" rx="4" class="progress-fill" style="--progress: 75px; animation-delay: 0.5s;"/>
        <text x="75" y="14" text-anchor="middle" class="mono" font-size="10" fill="#ffffff">50%</text>
      </g>
      
      <circle cx="715" cy="25" r="6" fill="#a371f7" class="pulse-check"/>
    </g>
  </g>

  <!-- Status Indicator -->
  <g transform="translate(700, 320)">
    <circle cx="0" cy="0" r="8" fill="#27ca40" opacity="0.3">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#27ca40"/>
    <text x="15" y="4" class="mono" font-size="10" fill="#27ca40">4 ACTIVE</text>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="348" width="800" height="2" fill="url(#progressGradient)"/>
</svg>