<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes radar-sweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      
      .radar-sweep { animation: radar-sweep 4s linear infinite; transform-origin: 700px 175px; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .blink { animation: blink 1.5s ease-in-out infinite; }
    </style>
    
    <linearGradient id="missionsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0B0F17"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="url(#missionsGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="350" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="45" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="28" class="mono" font-size="14" font-weight="700" fill="#00D4FF">MISSION_CONTROL // 2026</text>
  <text x="750" y="28" text-anchor="end" class="mono" font-size="11" fill="#64748B">OBJECTIVES</text>

  <!-- Mission Items -->
  <g transform="translate(25, 70)">
    <!-- Active Missions -->
    <g transform="translate(0, 0)">
      <rect width="350" height="45" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#22C55E">[ ACTIVE ]</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">DSA</text>
      <circle cx="320" cy="22" r="4" fill="#22C55E" class="pulse"/>
    </g>

    <g transform="translate(375, 0)">
      <rect width="350" height="45" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#22C55E">[ ACTIVE ]</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">CertiVault</text>
      <circle cx="320" cy="22" r="4" fill="#22C55E" class="pulse"/>
    </g>

    <g transform="translate(0, 60)">
      <rect width="350" height="45" fill="#0B0F17" stroke="#22C55E" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#22C55E">[ ACTIVE ]</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">Backend Engineering</text>
      <circle cx="320" cy="22" r="4" fill="#22C55E" class="pulse"/>
    </g>

    <!-- Learning Missions -->
    <g transform="translate(375, 60)">
      <rect width="350" height="45" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#00D4FF">[ LEARNING ]</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">Cloud</text>
      <circle cx="320" cy="22" r="4" fill="#00D4FF" class="blink"/>
    </g>

    <g transform="translate(0, 120)">
      <rect width="350" height="45" fill="#0B0F17" stroke="#00D4FF" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#00D4FF">[ LEARNING ]</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">DevOps</text>
      <circle cx="320" cy="22" r="4" fill="#00D4FF" class="blink"/>
    </g>

    <!-- Exploring Missions -->
    <g transform="translate(375, 120)">
      <rect width="350" height="45" fill="#0B0F17" stroke="#7C3AED" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#7C3AED">[ EXPLORING ]</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">System Design</text>
      <circle cx="320" cy="22" r="4" fill="#7C3AED" class="blink"/>
    </g>

    <!-- Future Missions -->
    <g transform="translate(0, 180)">
      <rect width="350" height="45" fill="#0B0F17" stroke="#64748B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#64748B">[ FUTURE ]</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">AI / ML</text>
      <circle cx="320" cy="22" r="4" fill="#64748B" class="blink"/>
    </g>

    <g transform="translate(375, 180)">
      <rect width="350" height="45" fill="#0B0F17" stroke="#64748B" stroke-width="1" rx="4"/>
      <text x="15" y="18" class="mono" font-size="10" fill="#64748B">[ FUTURE ]</text>
      <text x="15" y="35" class="mono" font-size="12" fill="#E6EDF3">Advanced Cloud</text>
      <circle cx="320" cy="22" r="4" fill="#64748B" class="blink"/>
    </g>
  </g>

  <!-- Radar Display -->
  <g transform="translate(700, 175)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#22C55E" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#00D4FF" stroke-width="2" class="radar-sweep" opacity="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#22C55E" class="pulse"/>
  </g>

  <!-- Status -->
  <g transform="translate(25, 280)">
    <rect width="750" height="40" fill="#0B0F17" stroke="#1E293B" stroke-width="1" rx="4"/>
    <text x="15" y="25" class="mono" font-size="11" fill="#64748B">MISSION STATUS: <tspan fill="#22C55E">3 ACTIVE OBJECTIVES</tspan></text>
    <text x="550" y="25" class="mono" font-size="11" fill="#64748B">PRIORITY: <tspan fill="#00D4FF">HIGH</tspan></text>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="330" width="800" height="20" fill="url(#accentGradient)"/>
</svg>