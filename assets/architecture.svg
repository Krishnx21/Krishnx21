<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 420" width="736" height="420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .flow { animation: flow 3s ease-in-out infinite; }
      @keyframes flow {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 1; }
      }
    </style>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="736" height="420" fill="url(#bgGradient)" rx="8"/>
  
  <!-- Subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="736" height="420" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="736" height="40" fill="#161b22" rx="8"/>
  <rect x="0" y="32" width="736" height="8" fill="#161b22"/>
  <text x="20" y="26" class="mono" font-size="14" font-weight="700" fill="#00d4ff">// ARCHITECTURE_MAP</text>
  <line x1="0" y1="40" x2="736" y2="40" stroke="#1a2332" stroke-width="1"/>

  <!-- Architecture Flow -->
  <g transform="translate(368, 60)">
    <!-- Center line -->
    <line x1="0" y1="30" x2="0" y2="330" stroke="#00d4ff" stroke-width="2" class="flow"/>
    
    <!-- Developer Node -->
    <rect x="-80" y="0" width="160" height="40" fill="#0d1117" stroke="#a371f7" stroke-width="2" rx="4"/>
    <text x="0" y="25" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#a371f7">DEVELOPER</text>
    
    <!-- Git/GitHub Node -->
    <rect x="-80" y="60" width="160" height="40" fill="#0d1117" stroke="#27ca40" stroke-width="2" rx="4"/>
    <text x="0" y="85" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#27ca40">GIT / GITHUB</text>
    
    <!-- Frontend Node -->
    <rect x="-80" y="120" width="160" height="40" fill="#0d1117" stroke="#e3b341" stroke-width="2" rx="4"/>
    <text x="0" y="145" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#e3b341">FRONTEND</text>
    
    <!-- REST API Node -->
    <rect x="-80" y="180" width="160" height="40" fill="#0d1117" stroke="#00d4ff" stroke-width="2" rx="4"/>
    <text x="0" y="205" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#00d4ff">REST API</text>
    
    <!-- Backend Node -->
    <rect x="-80" y="240" width="160" height="40" fill="#0d1117" stroke="#00d4ff" stroke-width="2" rx="4"/>
    <text x="0" y="265" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#00d4ff">BACKEND</text>
    
    <!-- Database/Cache Node -->
    <rect x="-80" y="300" width="160" height="40" fill="#0d1117" stroke="#27ca40" stroke-width="2" rx="4"/>
    <text x="0" y="325" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#27ca40">DATABASE / CACHE</text>
  </g>

  <!-- Side nodes -->
  <!-- Cloud/Containers -->
  <g transform="translate(140, 300)">
    <rect x="-60" y="0" width="120" height="40" fill="#0d1117" stroke="#00d4ff" stroke-width="2" rx="4"/>
    <text x="0" y="25" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#00d4ff">CLOUD</text>
    <line x1="60" y1="20" x2="150" y2="20" stroke="#00d4ff" stroke-width="1" class="flow"/>
  </g>

  <!-- CI/CD -->
  <g transform="translate(596, 180)">
    <rect x="-60" y="0" width="120" height="40" fill="#0d1117" stroke="#ff5f56" stroke-width="2" rx="4"/>
    <text x="0" y="25" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ff5f56">CI/CD</text>
    <line x1="-60" y1="20" x2="-150" y2="20" stroke="#ff5f56" stroke-width="1" class="flow"/>
  </g>

  <!-- Monitoring -->
  <g transform="translate(596, 300)">
    <rect x="-60" y="0" width="120" height="40" fill="#0d1117" stroke="#8b949e" stroke-width="2" rx="4"/>
    <text x="0" y="25" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#8b949e">MONITORING</text>
    <line x1="-60" y1="20" x2="-150" y2="20" stroke="#8b949e" stroke-width="1" class="flow"/>
  </g>

  <!-- Additional labels -->
  <text x="20" y="400" class="mono" font-size="10" fill="#8b949e">SCALE: MICROSERVICES</text>
  <text x="620" y="400" class="mono" font-size="10" fill="#8b949e">MODE: CLOUD-NATIVE</text>

  <!-- Bottom border -->
  <rect x="0" y="418" width="736" height="2" fill="#00d4ff"/>
</svg>