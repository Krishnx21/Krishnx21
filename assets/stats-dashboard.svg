<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', sans-serif; }
      
      @keyframes progress {
        from { stroke-dashoffset: 283; }
        to { stroke-dashoffset: 0; }
      }
      
      @keyframes counter {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 1; }
        100% { transform: scale(1.3); opacity: 0; }
      }
      
      @keyframes float-up {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(-20px); opacity: 0; }
      }
      
      .progress-circle {
        stroke-dasharray: 283;
        stroke-dashoffset: 283;
        animation: progress 2s ease-out forwards;
      }
      
      .counter {
        animation: counter 0.5s ease-out forwards;
      }
      
      .pulse-ring {
        animation: pulse-ring 2s ease-out infinite;
      }
      
      .float-up {
        animation: float-up 3s ease-in-out infinite;
      }
    </style>
    
    <linearGradient id="dashboardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099ff"/>
    </linearGradient>
    
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ca40"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="url(#dashboardGradient)" rx="12"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="350" fill="url(#grid)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="50" fill="#161b22" rx="12"/>
  <rect y="42" width="800" height="8" fill="#161b22"/>
  
  <text x="25" y="32" class="mono" font-size="14" font-weight="700" fill="#00d4ff">// LIVE_METRICS</text>
  <text x="750" y="32" text-anchor="end" class="mono" font-size="11" fill="#8b949e">REAL-TIME</text>
  
  <line x1="0" y1="50" x2="800" y2="50" stroke="#1a2332" stroke-width="1"/>

  <!-- Metrics Grid -->
  <g transform="translate(30, 80)">
    <!-- Total Commits -->
    <g transform="translate(0, 0)">
      <rect width="170" height="120" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="8"/>
      <circle cx="85" cy="50" r="35" fill="none" stroke="#1a2332" stroke-width="6"/>
      <circle cx="85" cy="50" r="35" fill="none" stroke="url(#blueGradient)" stroke-width="6" 
              class="progress-circle" transform="rotate(-90 85 50)"/>
      <text x="85" y="55" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#ffffff" class="counter">500+</text>
      <text x="85" y="95" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">TOTAL COMMITS</text>
    </g>

    <!-- PRs Merged -->
    <g transform="translate(190, 0)">
      <rect width="170" height="120" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="8"/>
      <circle cx="85" cy="50" r="35" fill="none" stroke="#1a2332" stroke-width="6"/>
      <circle cx="85" cy="50" r="35" fill="none" stroke="url(#purpleGradient)" stroke-width="6" 
              class="progress-circle" transform="rotate(-90 85 50)" style="animation-delay: 0.3s"/>
      <text x="85" y="55" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#ffffff" class="counter">50+</text>
      <text x="85" y="95" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">PRS MERGED</text>
    </g>

    <!-- Issues Closed -->
    <g transform="translate(380, 0)">
      <rect width="170" height="120" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="8"/>
      <circle cx="85" cy="50" r="35" fill="none" stroke="#1a2332" stroke-width="6"/>
      <circle cx="85" cy="50" r="35" fill="none" stroke="url(#pinkGradient)" stroke-width="6" 
              class="progress-circle" transform="rotate(-90 85 50)" style="animation-delay: 0.6s"/>
      <text x="85" y="55" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#ffffff" class="counter">30+</text>
      <text x="85" y="95" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">ISSUES CLOSED</text>
    </g>

    <!-- Code Reviews -->
    <g transform="translate(570, 0)">
      <rect width="170" height="120" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="8"/>
      <circle cx="85" cy="50" r="35" fill="none" stroke="#1a2332" stroke-width="6"/>
      <circle cx="85" cy="50" r="35" fill="none" stroke="url(#greenGradient)" stroke-width="6" 
              class="progress-circle" transform="rotate(-90 85 50)" style="animation-delay: 0.9s"/>
      <text x="85" y="55" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#ffffff" class="counter">100+</text>
      <text x="85" y="95" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">CODE REVIEWS</text>
    </g>
  </g>

  <!-- Activity Graph -->
  <g transform="translate(30, 220)">
    <rect width="740" height="100" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="8"/>
    <text x="15" y="25" class="mono" font-size="11" font-weight="700" fill="#00d4ff">ACTIVITY WAVE</text>
    
    <!-- Graph Lines -->
    <g transform="translate(15, 70)">
      <polyline points="0,0 30,20 60,5 90,30 120,10 150,25 180,15 210,35 240,20 270,40 300,25 330,45 360,30 390,50 420,35 450,55 480,40 510,60 540,45 570,65 600,50 630,70 660,55 690,75 710,60" 
                fill="none" stroke="url(#blueGradient)" stroke-width="2" filter="url(#glow)"/>
      
      <!-- Data Points -->
      <circle cx="0" cy="0" r="3" fill="#00d4ff"/>
      <circle cx="90" cy="30" r="3" fill="#00d4ff"/>
      <circle cx="180" cy="15" r="3" fill="#00d4ff"/>
      <circle cx="270" cy="40" r="3" fill="#00d4ff"/>
      <circle cx="360" cy="30" r="3" fill="#00d4ff"/>
      <circle cx="450" cy="55" r="3" fill="#00d4ff"/>
      <circle cx="540" cy="45" r="3" fill="#00d4ff"/>
      <circle cx="630" cy="70" r="3" fill="#00d4ff"/>
      <circle cx="710" cy="60" r="3" fill="#00d4ff"/>
    </g>
    
    <!-- Labels -->
    <text x="15" y="90" class="mono" font-size="9" fill="#8b949e">JAN</text>
    <text x="200" y="90" class="mono" font-size="9" fill="#8b949e">MAR</text>
    <text x="385" y="90" class="mono" font-size="9" fill="#8b949e">JUN</text>
    <text x="570" y="90" class="mono" font-size="9" fill="#8b949e">SEP</text>
    <text x="710" y="90" class="mono" font-size="9" fill="#8b949e">DEC</text>
  </g>

  <!-- Floating Indicator -->
  <g transform="translate(700, 70)" class="float-up">
    <circle cx="20" cy="20" r="8" fill="#27ca40" opacity="0.3" class="pulse-ring"/>
    <circle cx="20" cy="20" r="4" fill="#27ca40"/>
    <text x="35" y="24" class="mono" font-size="10" fill="#27ca40">LIVE</text>
  </g>

  <!-- Bottom Border -->
  <rect x="0" y="348" width="800" height="2" fill="url(#blueGradient)"/>
</svg>