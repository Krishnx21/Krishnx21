<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 3D Contribution Graph - Krishnx21</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #05060B;
            font-family: 'Cascadia Code', monospace;
            color: #E6EDF3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            color: #00D4FF;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
        }
        .graph-container {
            perspective: 1000px;
            width: 100%;
            max-width: 800px;
        }
        .graph {
            display: grid;
            grid-template-columns: repeat(52, 1fr);
            gap: 2px;
            transform-style: preserve-3d;
            transform: rotateX(60deg) rotateZ(-45deg);
            transition: transform 0.3s ease;
        }
        .graph:hover {
            transform: rotateX(45deg) rotateZ(-30deg);
        }
        .day {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            transition: all 0.2s ease;
            position: relative;
            transform-style: preserve-3d;
        }
        .day:hover {
            transform: translateZ(10px);
            box-shadow: 0 0 10px currentColor;
        }
        .level-0 { background: #161B22; height: 5px; }
        .level-1 { background: #0E4429; height: 10px; }
        .level-2 { background: #006D32; height: 15px; }
        .level-3 { background: #26A641; height: 20px; }
        .level-4 { background: #39D353; height: 25px; }
        .level-5 { background: #00D4FF; height: 30px; }
        
        .week {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .loading {
            color: #8B949E;
            text-align: center;
        }
        
        .legend {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            align-items: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #8B949E;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="header">// 3D_CONTRIBUTION_GRAPH // KRISHNX21</div>
    
    <div id="loading" class="loading">Loading contribution data...</div>
    
    <div class="graph-container">
        <div class="graph" id="contribution-graph"></div>
    </div>
    
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background: #161B22;"></div>
            <span>0</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #0E4429;"></div>
            <span>1-2</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #006D32;"></div>
            <span>3-5</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #26A641;"></div>
            <span>6-8</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #39D353;"></div>
            <span>9-12</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #00D4FF;"></div>
            <span>12+</span>
        </div>
    </div>
    
    <script>
        const username = 'Krishnx21';
        
        async function loadContributionData() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/events/public`);
                if (!response.ok) throw new Error('Failed to fetch data');
                
                const events = await response.json();
                const contributionData = generateContributionData(events);
                renderGraph(contributionData);
                
                document.getElementById('loading').style.display = 'none';
                
            } catch (error) {
                console.log('Using sample data due to:', error.message);
                const sampleData = generateSampleData();
                renderGraph(sampleData);
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function generateContributionData(events) {
            const data = {};
            const today = new Date();
            
            // Initialize last 365 days
            for (let i = 0; i < 365; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                data[dateStr] = 0;
            }
            
            // Count contributions from events
            events.forEach(event => {
                if (event.created_at) {
                    const dateStr = event.created_at.split('T')[0];
                    if (data.hasOwnProperty(dateStr)) {
                        data[dateStr]++;
                    }
                }
            });
            
            return data;
        }
        
        function generateSampleData() {
            const data = {};
            const today = new Date();
            
            for (let i = 0; i < 365; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                data[dateStr] = Math.floor(Math.random() * 15);
            }
            
            return data;
        }
        
        function renderGraph(contributionData) {
            const graph = document.getElementById('contribution-graph');
            const dates = Object.keys(contributionData).sort();
            
            // Organize data by weeks (52 weeks)
            const weeks = [];
            for (let i = 0; i < 52; i++) {
                weeks.push([]);
            }
            
            dates.forEach((date, index) => {
                const weekIndex = Math.floor(index / 7);
                const dayIndex = index % 7;
                if (weeks[weekIndex]) {
                    weeks[weekIndex][dayIndex] = contributionData[date];
                }
            });
            
            // Render the graph
            weeks.forEach(week => {
                const weekDiv = document.createElement('div');
                weekDiv.className = 'week';
                
                for (let day = 0; day < 7; day++) {
                    const contributionCount = week[day] || 0;
                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'day';
                    
                    let level = 0;
                    if (contributionCount === 0) level = 0;
                    else if (contributionCount <= 2) level = 1;
                    else if (contributionCount <= 5) level = 2;
                    else if (contributionCount <= 8) level = 3;
                    else if (contributionCount <= 12) level = 4;
                    else level = 5;
                    
                    dayDiv.classList.add(`level-${level}`);
                    dayDiv.title = `${contributionCount} contributions`;
                    
                    weekDiv.appendChild(dayDiv);
                }
                
                graph.appendChild(weekDiv);
            });
        }
        
        loadContributionData();
    </script>
</body>
</html>
