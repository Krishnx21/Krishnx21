<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Contribution Graph - Krishnx21</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05060B;
            font-family: 'Cascadia Code', monospace;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00D4FF;
            font-size: 14px;
            z-index: 100;
            background: rgba(5, 6, 11, 0.8);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #1E293B;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #8B949E;
            font-size: 18px;
            z-index: 100;
        }
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FF6B6B;
            font-size: 18px;
            z-index: 100;
            display: none;
            text-align: center;
            background: rgba(5, 6, 11, 0.9);
            padding: 20px;
            border-radius: 5px;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="info">// 3D_CONTRIBUTION_GRAPH // KRISHNX21</div>
    <div id="loading">Loading contribution data...</div>
    <div id="error"></div>
    
    <script>
        const username = 'Krishnx21';
        let scene, camera, renderer, contributionGroup;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        
        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05060B);
            
            // Camera setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 50);
            camera.lookAt(0, 0, 0);
            
            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);
            
            // Contribution group
            contributionGroup = new THREE.Group();
            scene.add(contributionGroup);
            
            // Event listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            renderer.domElement.addEventListener('wheel', onMouseWheel);
            
            // Load contribution data
            loadContributionData();
            
            // Animation loop
            animate();
        }
        
        async function loadContributionData() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/events/public`);
                if (!response.ok) throw new Error('Failed to fetch contribution data');
                
                const events = await response.json();
                
                // Generate contribution data from events
                const contributionData = generateContributionData(events);
                
                // Create 3D visualization
                create3DContributionGraph(contributionData);
                
                document.getElementById('loading').style.display = 'none';
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Error loading data: ' + error.message + '\nUsing sample data instead.';
                
                // Use sample data
                const sampleData = generateSampleData();
                create3DContributionGraph(sampleData);
            }
        }
        
        function generateContributionData(events) {
            const data = {};
            const today = new Date();
            
            // Initialize last 365 days
            for (let i = 0; i < 365; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                data[dateStr] = 0;
            }
            
            // Count contributions from events
            events.forEach(event => {
                if (event.created_at) {
                    const dateStr = event.created_at.split('T')[0];
                    if (data.hasOwnProperty(dateStr)) {
                        data[dateStr]++;
                    }
                }
            });
            
            return data;
        }
        
        function generateSampleData() {
            const data = {};
            const today = new Date();
            
            for (let i = 0; i < 365; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                
                // Generate random contribution data (0-15 contributions per day)
                const randomContributions = Math.floor(Math.random() * 16);
                data[dateStr] = randomContributions;
            }
            
            return data;
        }
        
        function create3DContributionGraph(contributionData) {
            const dates = Object.keys(contributionData).sort();
            const contributions = dates.map(date => contributionData[date]);
            const maxContributions = Math.max(...contributions, 1);
            
            // Create contribution cubes
            const boxGeometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const weeks = 52;
            const daysPerWeek = 7;
            
            for (let week = 0; week < weeks; week++) {
                for (let day = 0; day < daysPerWeek; day++) {
                    const index = week * daysPerWeek + day;
                    if (index >= contributions.length) break;
                    
                    const contributionCount = contributions[index];
                    const height = Math.max(0.5, (contributionCount / maxContributions) * 10);
                    
                    const color = getContributionColor(contributionCount);
                    const material = new THREE.MeshPhongMaterial({ 
                        color: color,
                        shininess: 100
                    });
                    
                    const cube = new THREE.Mesh(boxGeometry, material);
                    
                    // Position cubes in a grid pattern
                    cube.position.set(
                        (week - weeks / 2) * 1.2,
                        height / 2,
                        (day - daysPerWeek / 2) * 1.2
                    );
                    
                    cube.scale.y = height;
                    contributionGroup.add(cube);
                }
            }
            
            // Add ground plane
            const groundGeometry = new THREE.PlaneGeometry(weeks * 1.5, daysPerWeek * 1.5);
            const groundMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x0D1117,
                side: THREE.DoubleSide
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = Math.PI / 2;
            ground.position.y = -0.1;
            contributionGroup.add(ground);
        }
        
        function getContributionColor(count) {
            if (count === 0) return 0x161B22;
            if (count <= 2) return 0x0E4429;
            if (count <= 4) return 0x006D32;
            if (count <= 6) return 0x26A641;
            if (count <= 8) return 0x39D353;
            return 0x00D4FF;
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function onMouseDown(event) {
            isDragging = true;
            previousMousePosition = { x: event.clientX, y: event.clientY };
        }
        
        function onMouseMove(event) {
            if (!isDragging) return;
            
            const deltaX = event.clientX - previousMousePosition.x;
            const deltaY = event.clientY - previousMousePosition.y;
            
            contributionGroup.rotation.y += deltaX * 0.01;
            contributionGroup.rotation.x += deltaY * 0.01;
            
            previousMousePosition = { x: event.clientX, y: event.clientY };
        }
        
        function onMouseUp() {
            isDragging = false;
        }
        
        function onMouseWheel(event) {
            camera.position.z += event.deltaY * 0.05;
            camera.position.z = Math.max(20, Math.min(100, camera.position.z));
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Auto-rotate slowly when not dragging
            if (!isDragging) {
                contributionGroup.rotation.y += 0.002;
            }
            
            renderer.render(scene, camera);
        }
        
        // Initialize the scene
        init();
    </script>
</body>
</html>
