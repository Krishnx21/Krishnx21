<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 185" width="400" height="185">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="statsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060B"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="185" fill="url(#statsGradient)" rx="8"/>
  
  <!-- Header -->
  <text x="20" y="30" class="mono" font-size="12" font-weight="700" fill="#00d4ff">GITHUB STATS</text>
  <line x1="20" y1="40" x2="380" y2="40" stroke="#1a2332" stroke-width="1"/>

  <!-- Decorative elements -->
  <rect x="20" y="60" width="360" height="100" fill="#0d1117" stroke="#1a2332" stroke-width="1" rx="4" opacity="0.5"/>
</svg>